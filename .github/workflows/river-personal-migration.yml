# One-time compatibility deployment before the authorized Notion property rename.
# Remove after the migration; ordinary deployments retain the manual workflow.
name: Personal schedule compatibility migration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/river-personal-migration.yml']
permissions:
  contents: read
concurrency:
  group: river-cloudflare-production
  cancel-in-progress: false
jobs:
  cloudflare:
    if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release personal schedules and compact widget settings (build 43)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify compatibility and existing safeguards
        run: |
          node --check river/server/worker.mjs
          node river/server/personal-schedules.test.mjs
          node river/server/makeup.test.mjs
          node river/server/deploy-cloudflare.test.mjs
          node river/server/student-access.test.mjs
          node river/server/widget-devices.test.mjs
          node river/server/usage-design.test.mjs
      - name: Install pinned deployment tool on GitHub runner
        run: npm install --prefix "$RUNNER_TEMP/river-wrangler" --no-audit --no-fund wrangler@4.151.3
      - name: Check or deploy while retaining live settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_MODE: deploy
        run: |
          export WRANGLER_BIN="$RUNNER_TEMP/river-wrangler/node_modules/.bin/wrangler"
          node river/server/deploy-cloudflare.mjs "$DEPLOY_MODE"

