name: CHOI RIVER server deployment
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = 점검만 / deploy = 실제 서버 배포'
        required: true
        default: check
        type: choice
        options: [check, deploy]
  push:
    branches: [main]
    paths:
      - 'river/server/**'
      - '.github/workflows/river-server-cloudflare.yml'
permissions:
  contents: read
concurrency:
  group: river-cloudflare-production
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify server and deployment safeguards
        run: |
          node --check river/server/worker.mjs
          node river/server/deploy-cloudflare.test.mjs
          node river/server/push-delivery.test.mjs
          node river/server/widget-rounds.test.mjs
          node river/academy-anchor.test.mjs
          node river/server/student-access.test.mjs
          node river/server/widget-devices.test.mjs
          node river/server/makeup.test.mjs
          node river/server/academy-create.test.mjs
  cloudflare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned deployment tool on GitHub runner
        run: npm install --prefix "$RUNNER_TEMP/river-wrangler" --no-audit --no-fund wrangler@4.151.3
      - name: Check or deploy while retaining live settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_MODE: ${{ inputs.mode }}
        run: |
          export WRANGLER_BIN="$RUNNER_TEMP/river-wrangler/node_modules/.bin/wrangler"
          node river/server/deploy-cloudflare.mjs "$DEPLOY_MODE"
