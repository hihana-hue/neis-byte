name: Build CHOI RIVER Galaxy widget
on:
  push:
    branches: [main]
    paths:
      - 'river-widget/**'
      - '.github/workflows/river-widget-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test and build widget APK
        working-directory: river-widget
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: choi-river-widget-3x1
          path: river-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: choi-river-widget-test-reports
          path: |
            river-widget/app/build/reports/tests/
            river-widget/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
