name: Build CHOI RIVER Galaxy widget
on:
  push:
    branches: [main]
    paths:
      - 'river-widget/**'
      - 'river/server/widget-rounds.test.mjs'
      - '.github/workflows/river-widget-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check widget has no notification or alarm components
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("river-widget/app/src/main")
          forbidden = ["POST_NOTIFICATIONS", "SCHEDULE_EXACT_ALARM", "USE_EXACT_ALARM", "NotificationManager", "NotificationChannel", "AlarmManager"]
          for path in root.rglob("*"):
              if path.suffix in {".java", ".xml"}:
                  text = path.read_text()
                  for token in forbidden:
                      assert token not in text, f"{path}: unexpected {token}"
          PY
      - name: Verify widget feed and server
        run: |
          node --check river/server/worker.mjs
          node river/server/push-delivery.test.mjs
          node river/server/widget-rounds.test.mjs
          node river/server/usage-design.test.mjs
          node river/server/student-access.test.mjs
          node river/server/widget-devices.test.mjs
          node river/server/makeup.test.mjs
          node river/server/academy-create.test.mjs
      - name: Test and build unsigned release
        working-directory: river-widget
        run: gradle :app:testDebugUnitTest :app:assembleRelease :app:lintRelease --no-daemon --stacktrace
      - name: Sign release with persistent key
        id: signing
        env:
          KEY_B64: ${{ secrets.RIVER_SIGNING_KEY_B64 }}
          STORE_PASSWORD: ${{ secrets.RIVER_SIGNING_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RIVER_SIGNING_ALIAS }}
          EXPECTED_SHA256: ${{ secrets.RIVER_SIGNING_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEY_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$EXPECTED_SHA256" ]; then
            echo '::warning::Signing is not configured. No temporary-signed APK will be published. Run river-widget/scripts/setup-signing.ps1 on the owner PC.'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          keyfile="$RUNNER_TEMP/river-release.p12"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$KEY_B64" | base64 --decode > "$keyfile"
          mkdir -p signed
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 river-widget/app/build/outputs/apk/release/app-release-unsigned.apk signed/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$keyfile" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:STORE_PASSWORD --out signed/MARI-EDU-Widget-1.30.36.apk signed/aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs signed/MARI-EDU-Widget-1.30.36.apk > signed/certificate.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' signed/certificate.txt | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$EXPECTED_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$actual" && test "$actual" = "$expected"
          rm signed/aligned.apk
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Upload signed APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: choi-river-widget-signed
          path: signed/
          retention-days: 90
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: choi-river-widget-test-reports
          path: |
            river-widget/app/build/reports/tests/
            river-widget/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
      - name: Publish signed APK
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Never overwrite an installed version with a different artifact.
          if gh release view widget-1.30.36-icons >/dev/null 2>&1; then
            echo '::error::Version 1.30 mariedu already exists. Increase versionCode, versionName and release tag before publishing.'
            exit 1
          fi
          gh release create widget-1.30.36-icons signed/MARI-EDU-Widget-1.30.36.apk signed/certificate.txt --title "마리 에듀 1.30 · 디자인 설정" --notes "Direct APK downloads from marihome.co.kr with Android DownloadManager; current version and conditional Update at top of settings. Academy separators and persistent signature retained."


