name: Build CHOI RIVER Galaxy widget
on:
  push:
    branches: [main]
    paths:
      - 'river-widget/**'
      - 'river/server/worker.mjs'
      - 'river/server/push-delivery.test.mjs'
      - 'river/notification-popup.mjs'
      - 'river/notifications.mjs'
      - '.github/workflows/river-widget-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check widget has no notification or alarm components
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("river-widget/app/src/main")
          forbidden = ["POST_NOTIFICATIONS", "SCHEDULE_EXACT_ALARM", "USE_EXACT_ALARM", "NotificationManager", "NotificationChannel", "AlarmManager"]
          for path in root.rglob("*"):
              if path.suffix in {".java", ".xml"}:
                  text = path.read_text()
                  for token in forbidden:
                      assert token not in text, f"{path}: unexpected {token}"
          PY
      - name: Verify widget feed and server
        run: |
          node --check river/server/worker.mjs
          node river/server/push-delivery.test.mjs
          node river/server/widget-rounds.test.mjs
      - name: Test and build widget APK
        working-directory: river-widget
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: choi-river-widget-3x1
          path: river-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: choi-river-widget-test-reports
          path: |
            river-widget/app/build/reports/tests/
            river-widget/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp river-widget/app/build/outputs/apk/debug/app-debug.apk CHOI-RIVER-Widget-1.13.apk
          gh release view widget-1.13 >/dev/null 2>&1 || gh release create widget-1.13 --title "CHOI RIVER Widget 1.13" --notes "Color theme picker, flat pressed-state buttons, 3/6/9 academy items, school status filters, refresh color feedback and panel links. Debug signature may require reinstall."
          git archive --format=zip --prefix=CHOI-RIVER-Widget-1.13-source/ HEAD river-widget river/server/worker.mjs .github/workflows/river-widget-android.yml > CHOI-RIVER-Widget-1.13-source.zip
          cp river/server/worker.mjs CHOI-RIVER-Worker-1.13.mjs
          gh release upload widget-1.13 CHOI-RIVER-Widget-1.13.apk CHOI-RIVER-Widget-1.13-source.zip CHOI-RIVER-Worker-1.13.mjs --clobber
