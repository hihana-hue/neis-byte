const conciseDefinitions={"e_001": "손에 잡히는 물건과 형태가 없는 노동·편익", "e_006": "기업이 설비나 시설처럼 생산에 쓸 자본을 늘리는 지출", "e_012": "경제 전체가 활발한지 침체되어 있는지를 나타내는 상태. 활발한 국면은 호황", "e_016": "주식·채권·예금 등 자금 거래가 이루어지는 시장과, 자금이 나라와 시장 사이를 오가는 움직임", "e_018": "수요가 공급보다 많으면 가격이 오르고, 가격 상승에 따라 수요가 줄어 다시 균형을 찾는 원리", "e_020": "회사의 소유권을 나타내는 증서를 사고팔아 이익을 얻으려는 행위", "e_021": "투자 판단에 쓰는 공식 문서와 시장의 수치 자료", "e_024": "거래 참여자들이 모이는 자리를 제공하는 기업이 시장에 미치는 영향력", "e_031": "표시된 금액 자체와 그 금액으로 실제 살 수 있는 양인 구매력의 구분", "e_035": "자금 차입 비용이 낮아져 수익성이 있는 사업의 범위가 넓어지고 투자가 증가하는 관계", "e_036": "금리 상승으로 차입 이자 부담과 저축 수익이 늘어 소비와 투자가 줄어드는 관계", "e_060": "앞으로 물가나 경기가 어떻게 될지 예상하고 그에 맞춰 현재의 소비와 투자를 결정하는 과정", "e_068": "기업의 돈·빚·자산 상태와, 금리·경기·경쟁 구도 등 기업 외부의 조건", "e_106": "국가가 세금을 매기는 권한을 허용된 한계 이상으로 행사하는 것", "e_107": "재산의 소재지뿐 아니라 거주지를 기준으로 국가의 과세 권한을 정하는 방식", "e_110": "토지 소유자의 노력과 무관하게 개발로 발생한 이익의 일부를 공공이 거두는 제도", "e_112": "구매 희망자가 지불할 금액을 제시하는 행위와 그 금액", "e_113": "경매 물건을 특정 참여자에게 넘기기로 결정하는 일과 그 물건을 받는 사람", "e_114": "물건을 보유하여 실제로 얻을 이익의 크기. 주파수의 경우 해당 대역으로 통신 사업을 하여 벌어들일 수 있는 돈", "e_119": "다른 참여자의 입찰 정보를 몰라 적정 가격을 판단하기 어려워 지나치게 높거나 낮은 가격을 제시하는 상황", "e_120": "여러 물건을 함께 확보해야 할 때, 뒤의 물건을 확보하지 못할 위험 때문에 앞선 경매의 입찰도 주저하는 현상", "e_121": "자신의 입찰 정보는 감추고 다른 참여자의 정보만 얻으려는 전략", "e_123": "정부가 주파수 판매 대금을 최대한 크게 얻으려는 목표", "e_125": "현실을 분석하기 위해 단순한 상황과 조건을 먼저 설정하는 것", "e_126": "정보를 얻는 데 드는 돈·시간·노력", "e_127": "사용할 수 있는 돈과 시간의 한계. 사람마다 그 한계가 다르다는 점", "e_135": "어떤 결과가 나오도록 짜인 작동 구조나 제도적 장치", "e_137": "가입자가 보험 회사에 내는 돈과 사고 발생 시 보험 회사가 지급하는 돈", "e_138": "가입자의 사고 발생 가능성에 맞춰 보험료를 정하는 원칙", "e_139": "가입자 집단의 사고 발생 비율과 각 가입자의 과거 사고 기록", "e_143": "필요한 정보를 갖춘 경제 주체가 자신에게 가장 이득이 되는 선택을 한다는 가정", "e_144": "경제 주체의 합리적 선택을 가정하고 수식과 그래프로 결과를 계산·예측하는 방식", "e_145": "조건에 따라 결과를 미리 알 수 있는 상태와, 정보를 모아도 결과가 하나로 정해지지 않는 상태", "e_147": "들어온 정보를 받아들이고 비교하여 판단하는 힘. 한 번에 처리할 수 있는 양에는 한계가 있음", "e_156": "같은 성질의 대상을 묶은 전체와 그 안에 들어 있는 개별 대상", "e_169": "여러 요소가 서로 영향을 주고받으며 하나의 전체를 이루는 대상", "e_170": "시간이 흘러도 상태가 유지되는 것과 시간에 따라 상태가 달라지는 것의 구분", "e_177": "상위 주체가 계획을 세우고 하위 주체에 지시하여 전체를 움직이는 방식", "e_178": "값이 위아래로 흔들리는 정도. 클수록 변화를 예측하기 어려움", "e_180": "키보드 위쪽 글자 줄이 Q, W, E, R, T, Y 순서로 놓인 자판 배열", "e_181": "타자기에서 가까운 글자를 빠르게 연달아 입력할 때 글자마다 달린 쇠막대가 엉켜 작동이 멈추는 현상", "e_185": "진동수에 따라 나뉜 전파 중 통신에 쓰도록 정해 놓은 구간", "e_189": "경제학의 주요 성과에 수여되는 권위 있는 상"};
function definitionText(d){
 if(conciseDefinitions[d.id])return conciseDefinitions[d.id];
 let text=String(d.def||'').trim();
 const aliases=String(d.word||'').split(/[()·/]/).map(x=>x.trim()).filter(Boolean);
 for(const alias of aliases){const safe=alias; text=text.replace(new RegExp('^'+safe+'(?:은|는|이란|란)\\s*'),'');}
 for(const alias of aliases){const suffix=new RegExp('(?:을|를)?\\s*'+alias.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:이라고|라고)\\s*합니다\\.$');text=text.replace(suffix,'');}
 text=text.replace(/(?:을|를)\s*(?:말합니다|뜻합니다|가리킵니다)\.$/,'');
 text=text.replace(/(?:입니다|을 뜻합니다|를 뜻합니다|을 말합니다|를 말합니다|을 가리킵니다|를 가리킵니다)\.$/,'');
 const endings={'역할을 합니다.':'역할','좌우됩니다.':'좌우됨','가리키기도 합니다.':'가리키기도 함','이자를 받습니다.':'이자를 받는 증서','여기에 해당합니다.':'여기에 해당하는 대가','표시합니다.':'표시','나타냅니다.':'나타냄','수익이 됩니다.':'수익이 됨','여기 속합니다.':'여기에 속하는 돈','차익을 얻습니다.':'차익을 얻는 행위'};
 for(const [ending,value] of Object.entries(endings))if(text.endsWith(ending))text=text.slice(0,-ending.length)+value;
 return text.replace(/(?:입니다|이다)\s*[.!。]?\s*$/,'').replace(/[.!。]\s*$/,'').trim();
}

let saved;try{saved=new Set(JSON.parse(scopedStorage.getItem('gogeon-suteuk2027-stars-v1')||'[]'));if(saved.has(0)){saved.delete(0);const old=data.find(d=>d.word==='존고');if(old)saved.add(old.id)}}catch{saved=new Set()}

let only=false,showAll=false,flipped=new Set(),pool=[],index=0,correct=0,missed=[],timer,options=[],answered=false,ready=false;

function testSelection(){return filtered().slice((page-1)*pageSize,page*pageSize).filter(d=>(showAll||flipped.has(d.id))&&(!completed.has(d.id)||wrongView))}
function updateTestButton(){const n=testSelection().length;$('test').disabled=!n;$('test').title=n?'':'먼저 카드를 펼쳐 확인하세요';$('test').textContent='어휘 테스트'+(n?' ('+n+')':'')}
const titleKey=t=>String(t||'').split(' · ')[0].trim();
const normalizeBook=book=>/수능특강|수특독서/.test(book)?'수능특강':/수능완성|수완국어/.test(book)?'수능완성 수록작':'별도 자료';
const bookLabel=book=>normalizeBook(book)==='수능특강'?'수특독서':normalizeBook(book)==='수능완성 수록작'?'수완국어':'그외 어휘';
const cardBooks=d=>[...new Set([...(d.catalogBooks||[]),...(d.sources||[]).map(s=>s.book)].map(normalizeBook))].filter(b=>b!=='별도 자료');
const sourceHas=(d,book)=>cardBooks(d).includes(normalizeBook(book));
const passagePages={'수능특강':{21:'소비 이론',22:'소비 이론',48:'복잡계 경제학',49:'복잡계 경제학',109:'리더십 이론',114:'정보 비대칭과 역선택',115:'정보 비대칭과 역선택',122:'거시 경제 이론의 변천 및 IS–LM과 IS–MP 모형 비교·분석',123:'거시 경제 이론의 변천 및 IS–LM과 IS–MP 모형 비교·분석',136:'토지 행정의 주요 수단',243:'조세 법률주의, 상속세와 증여세',244:'조세 법률주의, 상속세와 증여세',286:'동시 다중 라운드 경매',287:'동시 다중 라운드 경매',304:'법인세',305:'법인세'},'수능완성 수록작':{162:'회피된 배출',163:'회피된 배출'}};
function cardWorks(d){const books=cardBooks(d);if(!books.length)return [{book:'별도 자료',title:titleKey(d.title)}];const result=[];for(const book of books){const raw=String(d.displaySource||'');const citation=raw.includes(' · ')?raw.slice(raw.indexOf(' · ')+3):raw;const parts=citation.split(' / ');const segment=books.length===1?parts.join(' '):parts.filter(p=>normalizeBook(p)===book).join(' ');const pages=[...segment.matchAll(/(\d+)(?:~\d+)?쪽/g)].map(m=>Number(m[1]));const titles=pages.map(page=>passagePages[book]?.[page]||(book==='수능완성 수록작'&&page===138?(['인지 편향','주식 투자에서 보이는 비합리적 경향'].includes(titleKey(d.title))?titleKey(d.title):'주식 투자에서 보이는 비합리적 경향'):titleKey(d.title)));for(const title of new Set(titles.length?titles:[titleKey(d.title)]))result.push({book,title});}return result;}
const catalogWorks=[];
for(const d of data)for(const w of cardWorks(d))if(!catalogWorks.some(x=>x.book===w.book&&x.title===w.title))catalogWorks.push({...w,id:'economy:'+w.book+':'+w.title});
const catalogValue=w=>'catalog:'+JSON.stringify([w.book,titleKey(w.title)]);
function matchesWork(d,value){if(!value)return true;if(value.startsWith('other:'))return titleKey(d.title)===value.slice(6);let book,title;if(value.startsWith('catalog:')){try{[book,title]=JSON.parse(value.slice(8))}catch{return false}}else{const w=catalogWorks.find(w=>w.id===value);if(!w)return false;book=w.book;title=titleKey(w.title)}return cardWorks(d).some(w=>w.book===normalizeBook(book)&&w.title===title)}
function filtered(){const q=$('search').value.trim();return data.filter(d=>(wrongView?wrongCards.has(d.id):completedView?completed.has(d.id):!completed.has(d.id))&&(!only||saved.has(d.id))&&(!$('category').value||d.cat===$('category').value)&&(!$('origin').value||($('origin').value==='별도 자료'?!(sourceHas(d,'수능특강')||sourceHas(d,'수능완성 수록작')):sourceHas(d,$('origin').value)))&&matchesWork(d,$('work').value)&&(!q||[d.word,d.def,d.title,...d.sources.map(s=>s.title)].some(t=>t?.includes(q))))}
function originText(d){const books=cardBooks(d);return books.length?books.map(bookLabel).join(' / '):'그외 어휘'}
function sourceText(d){return String(d.displaySource||'').replace(/(?:2027\s*)?수능특강(?:\s*독서)?/g,'수특독서').replace(/(?:2027\s*)?수능완성(?:\s*수록작)?/g,'수완국어').replace(/그\s*외\s*필수어휘/g,'그외 어휘');}
function quoteHtml(d){const quote=String(d.displayQuote||'');if(!quote)return '';const aliases=String(d.word||'').split(/[()·/]/).map(s=>s.trim()).filter(s=>s&&!/^[一-龥]+$/.test(s));if(!aliases.some(a=>quote.replace(/\s/g,'').includes(a.replace(/\s/g,''))))aliases.push(...String(d.word||'').split(/[\s()·/—-]+/).filter(a=>a.length>=2&&!['원리','관계','따른','행위','현상','위한','경제','구분','해당'].includes(a)));const patterns=aliases.map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').split(/\s+/).join('\\s*')).sort((a,b)=>b.length-a.length);if(!patterns.length)return "'"+esc(quote)+"'";const re=new RegExp(patterns.join('|'),'g');let html='',last=0;for(const match of quote.matchAll(re)){html+=esc(quote.slice(last,match.index))+'<strong>'+esc(match[0])+'</strong>';last=match.index+match[0].length;}return "'"+html+esc(quote.slice(last))+"'";}
function hanjaHtml(d){return d.hanjaExplanation?.length?'<p class="hanja-explanation"><strong class="explanation-label hanja-label">한자어</strong><br>'+d.hanjaExplanation.map(h=>'<span class="hanja-item">'+esc(h.character)+' '+esc(h.meaning)+' '+esc(h.reading)+'</span>').join(' · ')+'</p>':''}
function backHtml(d){return frontHtml(d)+'<div class="card-details"><div class="definition">'+esc(d.def)+'</div><div class="example">'+(d.title?'<div class="passage-title">「'+esc(d.title)+'」</div>':'')+'<small>'+esc(sourceText(d))+'</small><blockquote>'+quoteHtml(d)+'</blockquote><p class="modern-explanation"><strong class="explanation-label modern-label">해설포인트</strong><br>'+esc(d.modernExplanation)+'</p>'+hanjaHtml(d)+(d.caution?'<p class="card-caution"><strong>주의</strong><br>'+esc(d.caution)+'</p>':'')+'</div></div>'}
function render(){$('clearSearch').hidden=!$('search').value;const list=filtered();const pages=Math.max(1,Math.ceil(list.length/pageSize));page=Math.min(page,pages);const visible=list.slice((page-1)*pageSize,page*pageSize);$('count').innerHTML=(list.length?((page-1)*pageSize+1)+'–'+Math.min(page*pageSize,list.length):'0–0')+' / <small class="count-state">'+(completedView?'완료':wrongView?'오답':'미완료')+'</small> '+list.length+' 카드';$('starcount').textContent=data.filter(x=>saved.has(x.id)).length;$('all').classList.toggle('active',!only&&!completedView&&!wrongView);$('stars').classList.toggle('active',only);$('completed').classList.toggle('active',completedView);$('completecount').textContent=data.filter(d=>completed.has(d.id)).length;$('wrongcards').classList.toggle('active',wrongView);$('wrongcount').textContent=data.filter(d=>wrongCards.has(d.id)).length;$('grid').replaceChildren();visible.forEach(d=>{const back=showAll||flipped.has(d.id);if(back&&!completed.has(d.id))studied.add(d.id);const card=document.createElement('article');card.className='card'+(back?' back':'');const star=document.createElement('button');star.className='star'+(saved.has(d.id)?' saved':'');star.textContent=saved.has(d.id)?'★':'☆';star.setAttribute('aria-label',d.word+' 별표 '+(saved.has(d.id)?'해제':'저장'));star.onclick=()=>{saved.has(d.id)?saved.delete(d.id):saved.add(d.id);persist();sendProgress('progress');star.className='star'+(saved.has(d.id)?' saved':'');star.textContent=saved.has(d.id)?'★':'☆';star.setAttribute('aria-label',d.word+' 별표 '+(saved.has(d.id)?'해제':'저장'));$('starcount').textContent=data.filter(x=>saved.has(x.id)).length;if(only)render()};const flip=document.createElement('button');flip.className='flip';flip.setAttribute('aria-expanded',back);flip.setAttribute('aria-label',d.word+' 뜻 '+(back?'닫기':'보기'));flip.innerHTML=back?backHtml(d):frontHtml(d);flip.onclick=()=>{if(showAll){showAll=false;filtered().slice((page-1)*pageSize,page*pageSize).forEach(x=>flipped.add(x.id));$('show').textContent='뜻 모두 보기'}flipped.has(d.id)?flipped.delete(d.id):flipped.add(d.id);const nowBack=flipped.has(d.id);if(nowBack&&!completed.has(d.id))studied.add(d.id);updateTestButton();card.className='card'+(nowBack?' back':'');flip.setAttribute('aria-expanded',nowBack);flip.setAttribute('aria-label',d.word+' 뜻 '+(nowBack?'닫기':'보기'));flip.innerHTML=nowBack?backHtml(d):frontHtml(d)};const done=document.createElement('button');done.className='complete-toggle'+(completed.has(d.id)?' is-complete':'');done.textContent=completed.has(d.id)?'✓ 완료 해제':'완료';done.setAttribute('aria-label',d.word+' 완료 '+(completed.has(d.id)?'해제':'처리'));done.setAttribute('aria-pressed',completed.has(d.id));done.onclick=()=>setCompleted(d,!completed.has(d.id));card.append(star,flip,done);$('grid').append(card)});if(!list.length)$('grid').innerHTML='<div class="empty">이 조건에 해당하는 카드가 없습니다.<br>검색어나 필터를 바꿔 주세요.</div>';updateTestButton();renderPagination(pages,list.length)}
function frontHtml(d){return '<div class="card-heading"><div class="origin">'+esc(originText(d))+'</div><div class="word">'+esc(d.word)+'</div><div class="tag">'+esc(d.genre)+' · '+esc(d.cat)+'</div></div>'}
function renderPagination(pages,total){$('pagination').replaceChildren();if(!total)return;for(let n=1;n<=pages;n++){const b=document.createElement('button');b.textContent=String(n);b.setAttribute('aria-label',n+'페이지');if(n===page)b.setAttribute('aria-current','page');b.onclick=()=>{page=n;render()};$('pagination').append(b)}}
function populate(){for(const o of Array.from($('origin').options)){const n=data.filter(d=>!o.value||(o.value==='별도 자료'?!cardBooks(d).length:sourceHas(d,o.value))).length;o.text=o.value?bookLabel(o.value)+' ('+n+')':'출처';}$('category').options[0].text='분류';for(const c of [...new Set(data.map(d=>d.cat))])$('category').add(new Option(c+' ('+data.filter(d=>d.cat===c).length+')',c));for(const w of catalogWorks){const value=catalogValue(w),n=data.filter(d=>matchesWork(d,value)).length;if(n)$('work').add(new Option(bookLabel(w.book)+' · '+w.title+' ('+n+')',value));}$('stats').textContent='경제 '+new Set(data.map(d=>d.cat)).size+'분류 · '+data.length+'개 어휘'}
$('all').onclick=()=>{only=false;completedView=false;wrongView=false;page=1;render()};$('stars').onclick=()=>{only=true;completedView=false;wrongView=false;page=1;render()};$('completed').onclick=()=>{only=false;completedView=true;wrongView=false;page=1;render()};$('wrongcards').onclick=()=>{only=false;completedView=false;wrongView=true;page=1;render()};for(const id of ['category','origin','work'])$(id).onchange=()=>{resetOtherFilters(id);page=1;render()};$('search').oninput=()=>{page=1;render()};$('pageSize').onchange=()=>{pageSize=$('pageSize').value==='all'?data.length:Number($('pageSize').value);page=1;render()};$('show').onclick=()=>{showAll=!showAll;flipped.clear();if(showAll&&!completedView)filtered().slice((page-1)*pageSize,page*pageSize).forEach(d=>studied.add(d.id));$('show').textContent=showAll?'단어만 보기':'뜻 모두 보기';render()};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function chooseOptions(d){let candidates=shuffle(data.filter(o=>o.id!==d.id&&o.def!==d.def));candidates.sort((a,b)=>(b.cat===d.cat)-(a.cat===d.cat));const defs=new Set([d.def]),picked=[];for(const o of candidates){if(defs.has(o.def))continue;defs.add(o.def);picked.push(o);if(picked.length===3)break}return shuffle([d,...picked])}
function start(list){const eligible=list.filter(d=>!completed.has(d.id)||wrongView&&wrongCards.has(d.id));if(!eligible.length)return;pool=shuffle(eligible);index=0;correct=0;missed=[];if(!$('dialog').open)$('dialog').showModal();question()}
function question(){clearInterval(timer);answered=false;ready=true;const d=pool[index];$('number').textContent=(index+1)+' / '+pool.length;$('progress').style.width=(index/pool.length*100)+'%';$('stage').innerHTML='<div class="question">'+esc(d.word)+'<small>알맞은 뜻을 선택하세요 · 숫자 1–4</small></div><div id="options" class="options"></div><div class="feedback" id="feedback" aria-live="polite"></div>';options=chooseOptions(d);options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=(i+1)+'. '+o.def;b.onclick=()=>answer(i);$('options').append(b)})}
function answer(i){if(!ready||answered||!options[i])return;answered=true;const d=pool[index],ok=options[i].id===d.id;if(ok){correct++;wrongCards.delete(d.id);persistWrong();setCompleted(d,true)}else{missed.push(d);wrongCards.add(d.id);persistWrong();render()};sendProgress('answer',{cardId:d.id,correct:ok});[...$('options').children].forEach((b,j)=>{b.disabled=true;if(options[j].id===d.id)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').innerHTML='<strong>'+(ok?'정답입니다.':'오답입니다. 정답: '+esc(d.def))+'</strong><div class="quiz-source">'+backHtml(d)+'</div>';const next=document.createElement('button');next.className='primary next';next.textContent=index+1===pool.length?'결과 보기':'다음 카드';next.onclick=()=>{index++;index<pool.length?question():finish()};$('stage').append(next)}
function finish(){sendProgress('finish');clearInterval(timer);ready=false;$('progress').style.width='100%';$('stage').innerHTML='<div class="result"><div>테스트 완료</div><h2>'+correct+' / '+pool.length+' 정답</h2><p>정답률 '+Math.round(correct/pool.length*100)+'%</p>'+(missed.length?'<button id="retry" class="primary">오답 '+missed.length+'개 다시 풀기</button>':'')+'<button id="done">카드로 돌아가기</button></div>';if(missed.length)$('retry').onclick=()=>start([...missed]);$('done').onclick=closeTest}
function closeTest(){clearInterval(timer);ready=false;$('dialog').close()}$('close').onclick=closeTest;$('dialog').addEventListener('cancel',()=>{clearInterval(timer);ready=false});$('test').onclick=()=>start(testSelection());document.addEventListener('keydown',e=>{if($('dialog').open&&ready&&!answered&&['1','2','3','4'].includes(e.key))answer(Number(e.key)-1)});populate();restoreView();render();restoreTest();

// App-rendered menus keep option text compact on mobile platforms.
if(document.body){
const menus=[];
function placeMenu(button,list){if(typeof window==='undefined')return;if(window.innerWidth>600){list.style.top='';list.style.bottom='';list.style.maxHeight='';return}const rect=button.getBoundingClientRect(),below=window.innerHeight-rect.bottom-12,above=rect.top-12;if(below>=100||below>=above){list.style.top=(rect.bottom+4)+'px';list.style.bottom='auto';list.style.maxHeight=Math.max(60,Math.min(260,below-4))+'px'}else{list.style.top='auto';list.style.bottom=(window.innerHeight-rect.top+4)+'px';list.style.maxHeight=Math.max(60,Math.min(260,above-4))+'px'}}
function closeMenus(){for(const m of menus){m.list.hidden=true;m.button.setAttribute('aria-expanded','false')}}
for(const id of ['origin','category','work','pageSize']){
 const select=$(id),wrap=document.createElement('div'),button=document.createElement('button'),list=document.createElement('div');
 wrap.className='compact-select';wrap.dataset.selectId=id;button.type='button';button.className='select-trigger';button.setAttribute('aria-label',select.getAttribute('aria-label'));button.setAttribute('aria-haspopup','listbox');button.setAttribute('aria-expanded','false');list.className='select-options';list.setAttribute('role','listbox');list.hidden=true;select.before(wrap);wrap.append(button,list);select.hidden=true;
 const update=()=>{const option=Array.from(select.options).find(o=>o.value===select.value)||select.options[0];button.textContent=option.text+' ▾';button.classList.toggle('active',id!=='pageSize'&&!!select.value);for(const item of list.children)item.setAttribute('aria-selected',item.dataset.value===select.value?'true':'false')};
 for(const option of select.options){const item=document.createElement('button');item.type='button';item.textContent=option.text;item.dataset.value=option.value;item.setAttribute('role','option');item.onclick=()=>{select.value=option.value;select.onchange();update();closeMenus();button.focus()};list.append(item)}
 button.onclick=()=>{const opening=list.hidden;closeMenus();list.hidden=!opening;button.setAttribute('aria-expanded',String(opening));if(opening){if(['origin','category','work'].includes(id)){resetOtherFilters(id);page=1;render()}placeMenu(button,list);const items=Array.from(list.children);(items.find(b=>b.dataset.value===select.value)||items[0]).focus()}};
 wrap.addEventListener('keydown',e=>{const items=Array.from(list.children),current=items.indexOf(document.activeElement);if(e.key==='Escape'){closeMenus();button.focus();e.preventDefault()}else if(!list.hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){items[(current+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].focus();e.preventDefault()}});
 select.syncCompact=update;select.addEventListener('change',update);menus.push({wrap,button,list});update();
}
if(typeof window!=='undefined'){window.addEventListener('resize',closeMenus);window.addEventListener('scroll',closeMenus,{passive:true})}
document.addEventListener('click',e=>{if(!menus.some(m=>m.wrap.contains(e.target)))closeMenus()});
}

function saveView(){try{scopedStorage.setItem('gogeon-view-v1',JSON.stringify({page,pageSize,pageSizeChoice:$('pageSize').value,only,completedView,wrongView,showAll,flipped:[...flipped],search:$('search').value,origin:$('origin').value,category:$('category').value,work:$('work').value,scroll:typeof window!=='undefined'?window.scrollY:0,test:$('dialog').open?{scroll:$('dialog').scrollTop||0,pool:pool.map(d=>d.id),index,correct,missed:missed.map(d=>d.id),options:options.map(d=>d.id),answered,ready,stage:$('stage').innerHTML,number:$('number').textContent,progress:$('progress').style.width}:null}))}catch{}}
var restoredView;
function restoreView(){try{const v=JSON.parse(scopedStorage.getItem('gogeon-view-v1')||'null');if(!v)return;restoredView=v;page=Math.max(1,Number(v.page)||1);pageSize=v.pageSizeChoice==='all'?data.length:[20,40,80,100,200].includes(v.pageSize)?v.pageSize:20;only=!!v.only;completedView=!!v.completedView;wrongView=!!v.wrongView;showAll=!!v.showAll;flipped=new Set(v.flipped||[]);for(const id of ['search','origin','category','work']){let value=v[id]||'';if(id==='work'&&value.startsWith('other:')){const w=catalogWorks.find(w=>w.title===value.slice(6));value=w?catalogValue(w):''}if(id==='work'&&value&&!value.startsWith('catalog:')&&!value.startsWith('other:')){const w=catalogWorks.find(w=>w.id===value);value=w?catalogValue(w):''}$(id).value=value;if($(id).value!==value)$(id).value=''}$('pageSize').value=v.pageSizeChoice==='all'?'all':String(pageSize);$('show').textContent=showAll?'단어만 보기':'뜻 모두 보기'}catch{}}
function restoreTest(){const v=restoredView;if(!v)return;const t=v.test;if(t){const byId=id=>data.find(d=>d.id===id);pool=t.pool.map(byId).filter(Boolean);missed=t.missed.map(byId).filter(Boolean);options=t.options.map(byId).filter(Boolean);index=t.index;correct=t.correct;answered=t.answered;ready=t.ready;if(pool.length&&index<=pool.length){$('dialog').showModal();$('stage').innerHTML=t.stage;$('number').textContent=t.number;$('progress').style.width=t.progress;$('dialog').scrollTop=t.scroll||0;const optionNodes=$('options');if(optionNodes&&ready)Array.from(optionNodes.children).forEach((b,i)=>b.onclick=()=>answer(i));const next=$('stage').querySelector?.('.next');if(next)next.onclick=()=>{index++;index<pool.length?question():finish()};const retry=document.getElementById('retry');if(retry)retry.onclick=()=>start([...missed]);const done=document.getElementById('done');if(done)done.onclick=closeTest}}
if(typeof window!=='undefined')requestAnimationFrame(()=>window.scrollTo(0,v.scroll||0))}
if(typeof window!=='undefined'){window.addEventListener('pagehide',saveView);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveView()});for(const event of ['click','input','change'])document.addEventListener(event,()=>setTimeout(saveView,0));window.addEventListener('scroll',()=>{clearTimeout(window.viewSaveTimer);window.viewSaveTimer=setTimeout(saveView,150)},{passive:true})}

$('home').onclick=e=>{e?.preventDefault();if($('dialog').open)closeTest();page=1;only=false;completedView=false;wrongView=false;showAll=false;flipped.clear();$('show').textContent='뜻 모두 보기';for(const id of ['search','origin','category','work']){$(id).value='';if(typeof window!=='undefined')$(id).dispatchEvent(new Event('change'))}render();if(typeof window!=='undefined')window.scrollTo(0,0);saveView()};

$('toTop').onclick=()=>{if(typeof window!=='undefined')window.scrollTo({top:0,behavior:'smooth'})};

$('clearSearch').onclick=()=>{$('search').value='';page=1;render();$('search').focus?.();saveView()};

function resetOtherFilters(current){for(const id of ['origin','category','work'])if(id!==current){$(id).value='';$(id).syncCompact?.()}}
