<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>면접 연습 | MARI EDU LAB</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1b2430;--sub:#5d6876;--line:#dfe3ea;--pri:#1f4e8c;--pri2:#e8eef8;--ok:#2e7d4f;--okbg:#e6f3eb;--warn:#a35a00;--warnbg:#fff4e0;--ph:#fff1a8;--phink:#5a4500;--red:#b3261e;--pu:#6d3fc0;--pubg:#f0eafb}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b2129;--ink:#e8ecf1;--sub:#9aa5b3;--line:#2c3440;--pri:#7fa8e8;--pri2:#1f2b3d;--ok:#7cc79a;--okbg:#18291f;--warn:#f0b35b;--warnbg:#2e2412;--ph:#4a3f12;--phink:#ffe58a;--red:#f28b82;--pu:#b99bf0;--pubg:#2a2140}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:18px;margin:20px 0 8px}h3{font-size:16px;margin:14px 0 6px}
p{margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sub{color:var(--sub);font-size:14px}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600;min-height:48px;cursor:pointer;font-family:inherit}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.btn.pri{color:#0e1520}}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:8px 12px;font-size:14px}
.chip{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{color:#0e1520}}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--pri2);color:var(--pri);font-weight:600;white-space:nowrap}
.tag.g{background:var(--okbg);color:var(--ok)}.tag.r{background:var(--pubg);color:var(--pu)}.tag.i{background:var(--line);color:var(--sub)} .tag.x{background:#fdeee2;color:#b4541a} .chip.s-x{border-color:#b4541a;color:#b4541a} .chip.s-x.on{background:#b4541a;border-color:#b4541a;color:#fff} .fbox .chip{padding:3px 10px;min-height:30px;font-size:13px} .fbox .row{gap:6px}
.tag.ar{background:transparent;border:1px solid var(--pri);color:var(--pri);padding:1px 8px}
.fbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.frow{display:flex;gap:10px;align-items:flex-start}.frow+.frow{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.flbl{flex:none;width:40px;font-size:13px;font-weight:800;padding-top:7px}
.flbl.ar{color:var(--pri)}.flbl.src{color:var(--ok)}
.frow .row{flex:1}
.chip.s-all.on{background:var(--sub);border-color:var(--sub);color:#fff}
.chip.s-g.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.s-r.on{background:var(--pu);border-color:var(--pu);color:#fff}
.chip.s-i.on{background:var(--sub);border-color:var(--sub);color:#fff}
.chip.s-g{border-color:var(--ok);color:var(--ok)}.chip.s-r{border-color:var(--pu);color:var(--pu)}.chip.s-i{border-color:var(--sub);color:var(--sub)}
.tag.S{background:var(--red);color:#fff}.tag.A{background:var(--warn);color:#fff}.tag.B{background:var(--sub);color:#fff}
mark.ph{background:var(--ph);color:var(--phink);border-radius:4px;padding:0 3px}
.ans,.rec,.tip{white-space:pre-wrap} .recs{margin:0 0 14px} .recs h3{margin:0 0 8px} .recit{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)} .recit:first-of-type{border-top:0} .recit .rt{flex:1;min-width:0} .recit .rt b{font-size:14px} .recit .rt span{font-size:12px;color:var(--sub);margin-left:6px} .recit audio{width:100%;height:36px;margin-top:4px;display:block} .recx{flex:0 0 32px;height:32px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;font-size:16px;line-height:1;cursor:pointer;font-family:inherit} .recnote{font-size:11px;color:var(--sub);margin:8px 0 0} .recon{text-align:center;color:#d33;font-size:13px;font-weight:700;margin:-4px 0 6px} .snd{margin-left:auto;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:2px 9px;font-size:16px;line-height:1;min-height:30px;min-width:38px;cursor:pointer;font-family:inherit} .snd[aria-pressed="true"]{color:var(--sub)} .start summary{font-weight:700;font-size:17px} ol.steps{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:12px} ol.steps li{display:flex;gap:10px;align-items:flex-start} ol.steps li>b{flex:0 0 26px;height:26px;border-radius:50%;background:var(--line,#dfe3ea);display:flex;align-items:center;justify-content:center;font-size:14px} ol.steps li.ok>b{background:var(--pri,#1d4e89);color:#fff} ol.steps li.ok .st{color:var(--sub,#666)} ol.steps .st{font-weight:700} .btn.sm{padding:6px 12px;font-size:14px;margin-top:6px;width:auto} .aiwarn{margin:4px 0 8px;font-size:13px} .order{background:var(--warnbg);border-radius:10px;padding:8px 12px;font-size:14px;margin:4px 0 12px} .order b{margin-right:6px} table.fmt{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0} table.fmt th,table.fmt td{border-bottom:1px solid var(--line,#dfe3ea);padding:6px 4px;text-align:left;vertical-align:top} table.fmt td:last-child,table.fmt th:last-child{white-space:nowrap}
.tip{background:var(--warnbg);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px}
.list .item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;color:var(--ink);font-size:15px;cursor:pointer;font-family:inherit}
.item .meta{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
textarea,input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:110px;resize:vertical}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.qbig{font-size:22px;font-weight:700;line-height:1.45;margin:8px 0 16px}
.timer{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.timer.low{color:var(--red)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:15px}
.dday{font-size:40px;font-weight:800;color:var(--pri);line-height:1.1}
.back{appearance:none;background:none;border:none;color:var(--pri);font-size:15px;padding:8px 0;cursor:pointer;font-family:inherit}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{display:flex;max-width:640px;width:100%}
nav button{flex:1;appearance:none;background:none;border:none;color:var(--sub);font-size:13px;padding:8px 0 10px;min-height:58px;cursor:pointer;font-family:inherit}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--pri);font-weight:700}
nav.hide{display:none}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0}
summary{font-weight:700;cursor:pointer;min-height:32px}
ul{padding-left:20px;margin:6px 0}
.notice{background:var(--warnbg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.hide-ans{filter:blur(6px);user-select:none}
.check{display:flex;gap:8px;align-items:flex-start;font-weight:500}
.topbar{display:flex;justify-content:space-between;align-items:center;margin:-6px 0 6px;font-size:13px}.topbar a{color:var(--pri);text-decoration:none;font-weight:600}
.check input{width:22px;height:22px;flex:none;margin-top:2px}
.ov{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.ovc{background:var(--card);color:var(--ink);border-radius:16px;padding:18px;max-width:400px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%}
</style>
</head><body>
<main id="main"></main>
<nav id="nav"><div class="in">
<button data-tab="home"><b>⌂</b>홈</button>
<button data-tab="prac"><b>▶</b>연습</button>
<button data-tab="cards"><b>☰</b>카드</button>
<button data-tab="qs"><b>?</b>질문</button>
<button data-tab="info"><b>i</b>자료</button>
</div></nav>
<script>
const D=window.MARI_DATA;
if(!D||!Array.isArray(D.questions)){document.getElementById('main').innerHTML='<div class="card"><b>로그인 후 이용할 수 있습니다.</b><p class="sub">MARI EDU LAB에서 로그인해 주세요.</p></div>';throw Error('no data')}
const QUESTIONS=D.questions,CARDS=D.cards,CORE=D.core,META=D.meta||{};
const WHO=META.name||'본인';
const SRC={g:['공식 2026','g'],gj:['공식 2026(정시)','g'],r:['작년 후기','r'],x:['기출 예제','x'],i:['생기부 기반 예상','i']};
const AREAS=['활동','교직관','미래교육·AI','지원동기','시사·교육정책'];
const KEY='mari-interview-'+(META.app||'app')+':'+(window.MARI_ACCOUNT||'local');
let STORE_OK=true;
function blank(){return{my:{},cards:{},core:{},log:[],cnt:{},notice:{essay:'미확인',qn:'3',time:'8',memo:''}}}
let S=(function(){try{const t='__t';localStorage.setItem(t,'1');localStorage.removeItem(t);const v=JSON.parse(localStorage.getItem(KEY)||'null');return v?Object.assign(blank(),v):blank()}catch(e){STORE_OK=false;return blank()}})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){STORE_OK=false}}
const QM={};QUESTIONS.forEach(q=>QM[q.id]=q);const CM={};CARDS.forEach(c=>CM[c.id]=c);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brk=s=>String(s==null?'':s).replace(/([.)])[ \t]+(?=[^.:\n()'"‘’]{1,20}:\s)/g,'$1\n'); const fmt=s=>esc(s).replace(/\[\[(.+?)\]\]/g,'<mark class="ph">✎ $1</mark>');
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const srcTag=q=>`<span class="tag ${SRC[q.s][1]}">${SRC[q.s][0]}</span>`;
/* 말하기 시작 알림음 '띵동' (버튼을 누를 때만 재생) */
let AC=null;function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tones(list,type){if(S.mute)return;const c=audio();if(!c)return;const t=c.currentTime;list.forEach(([f,d,len])=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(type==='sine'&&f<600?0.45:0.35,t+d+(f<600?0.04:0.015));g.gain.exponentialRampToValueAtTime(0.0001,t+d+len);o.connect(g);g.connect(c.destination);o.start(t+d);o.stop(t+d+len+0.05)})}
function ding(){audio();tones([[1318.5,0,0.6],[1046.5,0.28,0.6]],'sine')}
/* 끝 알림음 '띠리': 음이 아래로 내려가는 짧은 종소리 */
function bellEnd(){tones([[523.25,0,0.55],[392,0.2,0.55],[261.63,0.4,1.2]],'sine')}
let V={tab:'home',view:null};let TM=null;
function stopTimer(){if(TM){clearInterval(TM);TM=null}}
/* 녹음: 이 기기 브라우저(IndexedDB)에만 저장, 질문마다 최근 5개 */
const REC_MAX=5;let REC=null,REC_URLS=[],REC_SAVING=false;
function recDB(){return new Promise((ok,no)=>{try{const r=indexedDB.open('mari-rec',1);r.onupgradeneeded=()=>r.result.createObjectStore('r',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})}
function recTx(mode,fn){return recDB().then(db=>new Promise((ok,no)=>{const t=db.transaction('r',mode),st=t.objectStore('r');let out;Promise.resolve(fn(st,v=>out=v));t.oncomplete=()=>{db.close();ok(out)};t.onerror=()=>{db.close();no(t.error)}}))}
function recAll(q){return recTx('readonly',(st,set)=>{const r=st.getAll();r.onsuccess=()=>set(r.result.filter(x=>x.acc===KEY&&x.q===q).sort((a,b)=>b.t-a.t))})}
function recAdd(item){return recTx('readwrite',st=>st.add(item)).then(()=>recAll(item.q)).then(list=>list.length>REC_MAX?recTx('readwrite',st=>list.slice(REC_MAX).forEach(x=>st.delete(x.id))):null)}
function recDel(id){return recTx('readwrite',st=>st.delete(id))}
function recStart(q){if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder&&window.indexedDB)){toast('이 브라우저는 녹음을 지원하지 않아 녹음 없이 진행합니다');return}
 const r={q,t:Date.now(),chunks:[],on:true};REC=r;
 navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{if(REC!==r||!r.on){stream.getTracks().forEach(k=>k.stop());return}
  const type=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
  const m=type?new MediaRecorder(stream,{mimeType:type}):new MediaRecorder(stream);r.m=m;r.stream=stream;r.t=Date.now();
  m.ondataavailable=e=>{if(e.data&&e.data.size)r.chunks.push(e.data)};
  m.onstop=()=>{stream.getTracks().forEach(k=>k.stop());const fin=()=>{if(r.keep){REC_SAVING=false;recShow()}};if(!r.keep||!r.chunks.length)return fin();const blob=new Blob(r.chunks,{type:m.mimeType||type||'audio/webm'});const dur=(r.end-r.t)/1000;if(dur<1)return fin();
   recAdd({acc:KEY,q:r.q,t:r.t,dur,blob}).catch(()=>toast('녹음을 저장하지 못했습니다')).then(fin)};
  m.start(1000);const el=document.getElementById('recon');if(el)el.hidden=false})
 .catch(()=>{if(REC===r)REC=null;toast('마이크를 쓸 수 없어 녹음 없이 진행합니다')})}
function recStop(keep){const r=REC;REC=null;if(!r)return;r.on=false;r.keep=keep;r.end=Date.now();if(r.m&&r.m.state!=='inactive'){if(keep)REC_SAVING=true;r.m.stop()}else if(r.stream)r.stream.getTracks().forEach(k=>k.stop())}
function recTitle(t){const d=new Date(t),p=n=>String(n).padStart(2,'0');return `${d.getMonth()+1}월 ${d.getDate()}일 ${p(d.getHours())}:${p(d.getMinutes())}`}
function recShow(){const box=document.getElementById('recs');if(!box)return;const q=box.dataset.q;
 recAll(q).then(list=>{if(!document.body.contains(box))return;REC_URLS.forEach(u=>URL.revokeObjectURL(u));REC_URLS=[];
  box.innerHTML=`<h3>내 녹음</h3>`+(list.length?list.map(x=>{const u=URL.createObjectURL(x.blob);REC_URLS.push(u);return `<div class="recit"><div class="rt"><b>${recTitle(x.t)}</b><span>${mmss(x.dur)}</span><audio controls preload="metadata" src="${u}"></audio></div><button class="recx" data-act="recdel" data-rid="${x.id}" aria-label="${recTitle(x.t)} 녹음 삭제" title="삭제">✕</button></div>`}).join(''):`<p class="sub">${REC_SAVING?'녹음을 저장하는 중…':'아직 녹음이 없습니다.'}</p>`)+`<p class="recnote">최대 ${REC_MAX}개까지 저장됩니다. 이 기기에만 저장돼요.</p>`})
 .catch(()=>{box.innerHTML=`<h3>내 녹음</h3><p class="sub">이 브라우저에서는 녹음을 불러올 수 없습니다.</p>`})}
/* 화면 안 확인창·알림 (브라우저 기본 창을 쓰지 않음) */
function ask(msg,ok,cancel,onOk){closeAsk();const d=document.createElement('div');d.id='askbox';d.className='ov';d.innerHTML=`<div class="ovc"><p style="font-weight:700;font-size:17px;margin:0 0 14px">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="askno">${esc(cancel)}</button><button class="btn pri" id="askok">${esc(ok)}</button></div></div>`;document.body.appendChild(d);document.getElementById('askno').onclick=closeAsk;document.getElementById('askok').onclick=()=>{closeAsk();onOk()}}
function closeAsk(){const d=document.getElementById('askbox');if(d)d.remove()}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
let HIST=[];/* 나가기·뒤로가 들어온 화면으로 돌아가도록 이전 화면을 기억 */ function go(tab,view){stopTimer();recStop(false);closeAsk();if(!view)HIST=[];else if(V.view?V.view.k!==view.k:V.tab!==tab)HIST.push(V);V={tab,view:view||null};render();window.scrollTo(0,0)} function back(){recStop(false);if(HIST.length){stopTimer();closeAsk();V=HIST.pop();render();window.scrollTo(0,0)}else go(V.tab)}
function dday(){const p=String(META.date||'2026-11-27').split('-').map(Number);const t=new Date(p[0],p[1]-1,p[2]);const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5)}
function coreSt(id){const v=(S.core[id]||'').trim().length;return v===0?0:v<60?1:2}
function cardSt(id){const c=S.cards[id]||{};const f=['f1','f2','f3','f4','f5'].filter(k=>(c[k]||'').trim()).length;if(!f&&!c.real)return 0;return f>=4&&c.real?2:1}
const ST=['○ 비어 있음','◐ 작성 중','● 완성'];
function pickToday(){const pend=QUESTIONS.filter(q=>q.c&&CM[q.c]&&CM[q.c].r!=='B'&&cardSt(q.c)<2);const pool=pend.length?pend:QUESTIONS;const d=new Date();const doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);return pool[doy%pool.length]}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===V.tab));document.getElementById('nav').classList.toggle('hide',!!(V.view&&V.view.k==='mock'&&V.view.ph==='run'));const m=document.getElementById('main');m.innerHTML=(STORE_OK?'':'<div class="notice">이 브라우저에서는 입력 내용이 저장되지 않을 수 있습니다. 자료 탭의 백업을 사용하세요.</div>')+(V.view?'':topbar())+view();bindAfter()}
function topbar(){if(!window.MARI_ACCOUNT)return '';return `<div class="topbar"><a href="https://www.marihome.co.kr/" target="_top">⌂ MARI EDU LAB</a><button class="back" data-act="logout">로그아웃</button></div>`}
function view(){const v=V.view;if(v){if(v.k==='q')return vQ(v.id);if(v.k==='card')return vCard(v.id);if(v.k==='core')return vCore(v.id);if(v.k==='one')return vOne();if(v.k==='mock')return vMock()}
return({home:vHome,prac:vPrac,cards:vCards,qs:vQs,info:vInfo})[V.tab]()}
/* HOME */

<details><summary>작년 후기에서 본 것 (개인 후기 3건)</summary><ul>
<li>질문 3~4개, 면접관 3명, 8분</li>
<li>나온 질문: 가장 열심히 한 활동과 배운 점 / 좋은 초등교사 / 미래 교육에서 초등교육의 역할 / AI·소프트웨어·미래사회 / 교사의 인성적 덕목 / 교사 꿈에 가까워진 활동 / 교대 지원 이유</li>
<li>"생기부 활동을 꼼꼼하게 묻는 게 아니라 질문에 내 활동을 엮어 답해야 한다"(후기)</li>
<li>마지막 할 말이 있었다는 후기와 없었다는 후기가 모두 있음</li></ul><p class="sub">개인 후기라 전형과 진행 방식이 ${esc(WHO)}와 같다는 보장은 없습니다.</p></details>
<details><summary>대학 이해 한 장</summary><ul>
<li><b>건학이념</b> 참·사랑·새로움 — 참: 진리 탐구 / 사랑: 고매한 인격과 양식 / 새로움: 미래사회에 능동적으로 대응하는 창조성 (홈페이지)</li>
<li><b>교육목적</b> 도덕성과 전문성을 갖춘 유능하고 창의적인 교원 양성 (홈페이지)</li>
<li><b>비전</b> 작지만 강한 대학 함께 만드는 미래교육 혁신플랫폼. 목표에 "교육혁신을 주도할 미래형 초등교사 양성", 전략에 "AI·디지털 교육혁신을 주도하는 대학", "지역을 기반으로 상생 공동체 대학" (홈페이지)</li>
<li><b>인재상</b> 인성과 전문성을 갖춘 교육실천가 · <b>핵심역량</b> 수업전문성, 교육리더십, 생태시민성, 의사소통력, 도덕적상상력 (구판 브로슈어, 지금과 다를 수 있음)</li>
<li><b>교육과정</b> 1학년은 무학과제, 이후 12개 심화과정(윤리·국어·사회·수학·과학·실과·음악·미술·체육·초등·영어·컴퓨터). 교육과정에 초등안전교육, 응급처치 및 심폐소생술 포함. 일본 오사카교육대학·효고교육대학 학생교류 (2027 요강)</li></ul>
<p class="sub">문구를 외워서 읊기보다, 내 활동을 말한 뒤 한 문장으로 연결하는 정도가 안전합니다.</p></details>
<details open><summary>답변 형식</summary>
<p class="sub">한 답변은 1분 안팎. 8분에 질문 3~4개와 꼬리질문이 오갑니다.</p>
<table class="fmt"><tr><th>순서</th><th>내용</th><th>길이</th></tr>
<tr><td>1. 결론</td><td>"저는 ○○라고 생각합니다." 먼저 말하기</td><td>1문장</td></tr>
<tr><td>2. 이유</td><td>왜 그런지 1~2개</td><td>2문장</td></tr>
<tr><td>3. 내 경험</td><td>생기부 활동 하나: 무엇을, 왜, 어떻게, 무엇을 배웠는지</td><td>3~4문장</td></tr>
<tr><td>4. 교사가 되면</td><td>그 배움을 교실에서 어떻게 쓸지</td><td>1~2문장</td></tr>
<tr><td>5. 보완(필요할 때)</td><td>부족한 점을 인정하고 대학에서 배울 것</td><td>1문장</td></tr></table>
<p class="sub">결론을 먼저 말하는 방식은 청주교대 학생부종합전형 안내서가 권하는 방식입니다(다른 교대 자료).</p></details>
<details><summary>어려운 질문 판단 순서</summary><p class="sub">상황 질문(학생 갈등, 학부모, AI 등)은 머릿속으로 이 순서를 거친 뒤 답합니다.</p><ul>
<li><b>① 아이</b> 가장 영향받는 아이, 가장 약한 아이는 누구인가</li>
<li><b>② 사실</b> 확인된 것과 모르는 것은 무엇인가. 단정하지 않기</li>
<li><b>③ 관점</b> 아이·학부모·동료교사·학교 각각의 입장</li>
<li><b>④ 원칙</b> 학습권·안전·공정·존중 중 무엇이 걸려 있나</li>
<li><b>⑤ 실천</b> 지금 할 수 있는 구체 행동 + 다시 일어나지 않게 할 예방</li></ul></details>
<details><summary>답변 원칙</summary><ul>
<li>생기부에 없는 일, 하지 않은 결과는 말하지 않기 (평가항목이 '학생부 기재사항의 신뢰도')</li>
${(META.rules||[]).map(r=>`<li>${esc(r)}</li>`).join('')}
<li>모르는 것은 "그 부분은 정확히 모릅니다. 다만 ~"으로 정직하게</li>
<li>꼬리질문에서 새 조건이 나오면: "그 조건이라면 처음 생각을 조금 바꿔야 할 것 같습니다. 먼저 ○○를 확인하겠습니다."</li></ul>
<h3>피해야 할 답</h3><ul>
<li><b>추상적 다짐</b> "모든 아이를 사랑하는 교사가 되겠습니다"로 끝내지 않기. 경험과 구체 행동을 붙이기</li>
<li><b>한쪽 편만 들기</b> 무조건 학생 편, 무조건 교사 편을 피하고 원칙과 소통을 함께</li>
<li><b>혼자 다 해결하기</b> 학부모·동료교사·학교와 함께 해결한다고 말하기</li>
<li><b>진로 변경 감추기</b> 1학년 기록은 면접관도 보고 있음. 먼저 인정하기</li>
<li><b>외운 문장 낭독</b> 핵심 단어만 기억하고 말은 그 자리에서 만들기</li>
<li><b>개인정보</b> 학교명, 부모 직업은 말하지 않기 (전주교대 요강에 블라인드 여부 명시는 없음)</li></ul></details>
<details><summary>면접 당일 체크리스트</summary><ul>
<li>수험표, 신분증 (인정: 주민등록증, 운전면허증, 청소년증, 학생증 등)</li>
<li>면접고사장과 대기실에서 휴대전화 소지 불가</li>
<li>11.20 공지에서 집결 시간과 장소 확인</li>
<li>시계 지참 가능 여부는 공지로 확인 (요강에 없음)</li>
<li>전날: 기본 답변 5를 소리 내어 한 번씩</li></ul></details>
<details><summary>11.20 면접 공지 입력</summary><p class="sub">공지가 나오면 입력하세요. 모의면접 설정에 반영됩니다.</p>
<label for="ne">제시문</label><select id="ne" data-save="notice" data-f="essay">${['미확인','없음','있음'].map(x=>`<option ${n.essay===x?'selected':''}>${x}</option>`).join('')}</select>
<label for="nq">기본 질문 수</label><select id="nq" data-save="notice" data-f="qn">${['3','4'].map(x=>`<option ${n.qn===x?'selected':''}>${x}</option>`).join('')}</select>
<label for="nm">기타 (집결 시간, 장소, 진행 방식)</label><textarea id="nm" data-save="notice" data-f="memo">${esc(n.memo||'')}</textarea></details>
<details><summary>내 입력 백업</summary><p class="sub">입력 내용은 이 기기의 이 브라우저에만 저장됩니다. 다른 기기로 옮기거나 지워질 때를 대비해 백업하세요.</p>
<button class="btn sm" data-act="exp">백업 파일 내려받기</button>
<label for="imp">백업 불러오기 (파일 선택)</label><input type="file" id="imp" accept=".json,application/json"></details>`}
/* EVENTS */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-tab]');if(!b)return;
if(b.dataset.tab){QF={a:'',s:''};if(b.dataset.tab==='info'&&!S.seenRules){S.seenRules=true;save()}go(b.dataset.tab);return}
const a=b.dataset.act,id=b.dataset.id,v=V.view;
if(a==='one')startOne(id);
else if(a==='onerand'){const pool=QUESTIONS.filter(q=>!b.dataset.a||q.a===b.dataset.a);startOne(leastPick(pool).id)}
else if(a==='q')go('qs',{k:'q',id});
else if(a==='card')go('cards',{k:'card',id});
else if(a==='core')go('cards',{k:'core',id});
else if(a==='close'){back()} else if(a==='mute'){S.mute=!S.mute;save();render();toast(S.mute?'알림음을 껐습니다':'알림음을 켰습니다')} else if(a==='readrules'){S.seenRules=true;save();HIST=[];go('info')}
else if(a==='dur'){v.dur=+b.dataset.s;render()}
else if(a==='start1'){ding();v.ph='run';v.left=v.dur;v.t0=Date.now();render();recStart(v.id);TM=setInterval(()=>{v.left=v.dur-(Date.now()-v.t0)/1000;const t=document.getElementById('tm');if(t){t.textContent=mmss(v.left);t.classList.toggle('low',v.left<=15)}if(v.left<=0)endOne()},250)}
else if(a==='end1')endOne();
else if(a==='recdel'){const rid=Number(b.dataset.rid);ask('이 녹음을 삭제할까요?','삭제','취소',()=>recDel(rid).then(recShow).catch(()=>toast('삭제하지 못했습니다')))}
else if(a==='again1'){V.view={k:'one',id:v.id,ph:'ready',dur:v.dur};render()}
else if(a==='next1'){const q=QM[v.id];const pool=QUESTIONS.filter(x=>x.a===q.a&&x.id!==q.id);startOne(leastPick(pool.length?pool:QUESTIONS).id)}
else if(a==='mockgo')go('prac',{k:'mock',ph:'setup',n:S.notice.qn||'3',fu:true,last:false});
else if(a==='mn'){v.n=b.dataset.v;v.fu=document.getElementById('mfu').checked;v.last=document.getElementById('mlast').checked;render()}
else if(a==='mockstart'){ding();v.fu=document.getElementById('mfu').checked;v.last=document.getElementById('mlast').checked;v.items=buildMock(v.n,v.fu,v.last);v.i=0;v.times=[];v.ph='run';v.left=480;v.t0=Date.now();v.qt=Date.now();render();window.scrollTo(0,0);
TM=setInterval(()=>{v.left=480-(Date.now()-v.t0)/1000;const t=document.getElementById('tm');if(t){t.textContent=mmss(v.left);t.classList.toggle('low',v.left<=60)}if(v.left<=0){v.timeout=true;mockNext(true)}},250)}
else if(a==='mocknext')mockNext(false);
else if(a==='mockstop'){ask('모의면접을 그만할까요? 이번 회차 기록은 저장되지 않습니다.','그만하기','계속하기',()=>{stopTimer();V={tab:'prac',view:null};render();window.scrollTo(0,0)})}
else if(a==='mocksave'){const tot=v.times.reduce((x,y)=>x+y,0);S.log.push({t:Date.now(),m:'mock',sec:tot,memo:(document.getElementById('mmemo')||{}).value||'',qs:v.items.map(i=>i.q||i.text)});v.items.forEach(i=>{if(i.q)S.cnt[i.q]=(S.cnt[i.q]||0)+1});save();V.view=null;V.tab='home';render()}
else if(a==='logout'){try{parent.postMessage({channel:'mari-logout'},'*')}catch(e){}}
else if(a==='qfa'){QF.a=b.dataset.v;render()}
else if(a==='qfs'){QF.s=b.dataset.v;render()}
else if(a==='exp'){try{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=(META.backupName||'면접연습_백업')+'_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(err){toast('이 화면에서는 내려받기를 할 수 없습니다. 브라우저로 열어 주세요.')}}
});
function endOne(){const v=V.view;stopTimer();recStop(true);bellEnd();v.used=Math.min(v.dur,(Date.now()-v.t0)/1000);v.ph='done';S.cnt[v.id]=(S.cnt[v.id]||0)+1;S.log.push({t:Date.now(),m:'one',q:v.id,sec:v.used});save();render()}
function mockNext(timeout){const v=V.view;v.times[v.i]=(Date.now()-v.qt)/1000;v.qt=Date.now();if(timeout||v.i>=v.items.length-1){stopTimer();bellEnd();v.ph='done';V.view=v;render();window.scrollTo(0,0);return}v.i++;render()}
document.addEventListener('input',e=>{const el=e.target,k=el.dataset.save;if(!k)return;const id=el.dataset.id;
if(k==='my'){S.my[id]=el.value}else if(k==='core'){S.core[id]=el.value}else if(k==='card'){(S.cards[id]=S.cards[id]||{})[el.dataset.f]=el.value}else if(k==='notice'){S.notice[el.dataset.f]=el.value}save()});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.save==='real'){(S.cards[el.dataset.id]=S.cards[el.dataset.id]||{}).real=el.checked;save()}
else if(el.dataset.save==='notice'){S.notice[el.dataset.f]=el.value;save()}
else if(el.id==='imp'&&el.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);ask('지금 입력한 내용을 백업 파일 내용으로 바꿀까요?','바꾸기','취소',()=>{S=Object.assign(blank(),d);save();render();toast('백업을 불러왔습니다.')})}catch(err){toast('백업 파일을 읽을 수 없습니다.')}};r.readAsText(el.files[0])}});
function bindAfter(){if(document.getElementById('recs'))recShow()}
render();
</script>
