<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:14px system-ui;background:#f4f8f8;color:#19383a}form{max-width:340px;margin:10vh auto;padding:24px;background:white;border-radius:12px}h1{font-size:19px}input:not([type=checkbox]),button{box-sizing:border-box;width:100%;padding:10px;margin:8px 0;border:1px solid #b9cccc;border-radius:6px}button{background:#17838c;color:white;cursor:pointer}#status{font-size:12px;color:#9d3125}[hidden]{display:none!important}iframe{border:0;width:100%;height:100dvh;display:block}#logout{position:fixed;left:8px;top:7px;right:auto;bottom:auto;z-index:1000;width:28px;height:28px;margin:0;padding:5px;border:1px solid #ffffff55;border-radius:6px;background:#1c555a;color:#fff;display:grid;place-items:center}#logout svg{width:17px;height:17px}#logout:focus-visible{outline:2px solid #8fd2d8;outline-offset:2px}#sync{position:fixed;bottom:60px;left:8px;font-size:10px;background:white}</style><div id="loading" role="status" style="text-align:center;margin:20vh 20px;font-size:13px;color:#1c555a">학습 화면을 불러오는 중…</div><form id="login" hidden><h1>2027 수능 고전 어휘 개념어</h1><label>아이디<input id="id" autocomplete="username" required></label><label>PIN<input id="pin" type="password" autocomplete="current-password" required></label><label><input id="remember" type="checkbox"> 이 기기에서 자동로그인</label><button>로그인</button><p id="status" role="status"></p></form><iframe id="app" hidden title="고전 어휘 학습"></iframe><span id="sync" hidden></span><script>
let deviceId=localStorage.getItem('mari-device');if(!deviceId){deviceId=crypto.randomUUID();localStorage.setItem('mari-device',deviceId);}const ua=navigator.userAgent,deviceLabel=(/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)?'iPad':/iPhone/.test(ua)?'iPhone':/Android/.test(ua)?'Android':/Windows/.test(ua)?'Windows':'Mac / PC')+' · '+(/Edg/.test(ua)?'Edge':/Firefox/.test(ua)?'Firefox':/Chrome/.test(ua)?'Chrome':'Safari / 기타');let token='',frame=document.getElementById('app');const $=id=>document.getElementById(id);function fail(e){$('loading').hidden=true;token="";$('status').textContent=e.message||'연결 실패';$('login').hidden=false;frame.hidden=true;}
function showApp(r){$('loading').hidden=false;$('login').hidden=true;frame.onload=()=>{$('loading').hidden=true;frame.hidden=false;};frame.srcdoc=r.html.replace('<head>','<head><script>window.MARI_ACCOUNT='+JSON.stringify(r.id).replace(/</g,'\\u003c')+';window.MARI_COMPLETED='+JSON.stringify(r.completed||[])+';<\/script>');}
function open(t){token=t;google.script.run.withSuccessHandler(showApp).withFailureHandler(e=>{localStorage.removeItem('mari-session');sessionStorage.removeItem('mari-session');fail(e);}).loadApp(t);}
$('login').onsubmit=e=>{e.preventDefault();$('status').textContent='로그인 확인 중…';$('login').hidden=true;$('loading').hidden=false;google.script.run.withSuccessHandler(r=>{localStorage.removeItem('mari-session');sessionStorage.removeItem('mari-session');($('remember').checked?localStorage:sessionStorage).setItem('mari-session',r.token);$('pin').value='';token=r.token;showApp(r);}).withFailureHandler(fail).loginAndLoad($('id').value,$('pin').value,$('remember').checked,deviceId,deviceLabel);};
function doLogout(){google.script.run.logout(token);localStorage.removeItem('mari-session');sessionStorage.removeItem('mari-session');token='';frame.srcdoc='';fail({message:'로그아웃되었습니다.'});};
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||!token)return;if(e.data?.channel==='mari-logout'){doLogout();return;}if(e.data?.channel!=='mari-progress')return;$('sync').hidden=false;$('sync').textContent='학습 기록 저장 중';google.script.run.withSuccessHandler(()=>{$('sync').textContent='학습 기록 저장됨';frame.contentWindow.postMessage({channel:'mari-ack',eventId:e.data.event.eventId},'*');}).withFailureHandler(e=>{$('sync').textContent='기록 저장 실패';if(/로그인|기기|만료/.test(e.message||''))fail(e);}).recordProgress(token,e.data.event);});
setInterval(()=>{if(token)google.script.run.withFailureHandler(fail).heartbeat(token);},60000);try{const t=localStorage.getItem('mari-session')||sessionStorage.getItem('mari-session');if(t)open(t);else{$('loading').hidden=true;$('login').hidden=false;}}catch{ $('loading').hidden=true;$('login').hidden=false;}
</script></html>
