<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:14px system-ui;background:#f4f8f8;color:#19383a}form{max-width:340px;margin:10vh auto;padding:24px;background:white;border-radius:12px}h1{font-size:19px}input:not([type=checkbox]),button{box-sizing:border-box;width:100%;padding:10px;margin:8px 0;border:1px solid #b9cccc;border-radius:6px}button{background:#17838c;color:white;cursor:pointer}#status{font-size:12px;color:#9d3125}[hidden]{display:none!important}iframe{border:0;width:100%;height:100dvh;display:block}#logout{position:fixed;right:8px;bottom:60px;width:auto;padding:4px 8px;font-size:11px}#sync{position:fixed;bottom:60px;left:8px;font-size:10px;background:white}</style><form id="login"><h1>2027 수능 고전 어휘 개념어</h1><label>아이디<input id="id" autocomplete="username" required></label><label>PIN<input id="pin" type="password" autocomplete="current-password" required></label><label><input id="remember" type="checkbox"> 이 기기에서 자동로그인</label><button>로그인</button><p id="status" role="status"></p></form><iframe id="app" hidden title="고전 어휘 학습"></iframe><button id="logout" hidden>로그아웃</button><span id="sync" hidden></span><script>
let deviceId=localStorage.getItem('mari-device');if(!deviceId){deviceId=crypto.randomUUID();localStorage.setItem('mari-device',deviceId);}const ua=navigator.userAgent,deviceLabel=(/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)?'iPad':/iPhone/.test(ua)?'iPhone':/Android/.test(ua)?'Android':/Windows/.test(ua)?'Windows':'Mac / PC')+' · '+(/Edg/.test(ua)?'Edge':/Firefox/.test(ua)?'Firefox':/Chrome/.test(ua)?'Chrome':'Safari / 기타');let token='',frame=document.getElementById('app');const $=id=>document.getElementById(id);function fail(e){token="";$('status').textContent=e.message||'연결 실패';$('login').hidden=false;frame.hidden=true;$('logout').hidden=true;}
function open(t){token=t;google.script.run.withSuccessHandler(r=>{$('login').hidden=true;frame.hidden=false;$('logout').hidden=false;frame.srcdoc=r.html.replace('<head>','<head><script>window.MARI_ACCOUNT='+JSON.stringify(r.id)+';window.MARI_COMPLETED='+JSON.stringify(r.completed)+';<\/script>');}).withFailureHandler(e=>{localStorage.removeItem('mari-session');sessionStorage.removeItem('mari-session');fail(e);}).loadApp(t);}
$('login').onsubmit=e=>{e.preventDefault();$('status').textContent='로그인 확인 중…';google.script.run.withSuccessHandler(r=>{localStorage.removeItem('mari-session');sessionStorage.removeItem('mari-session');($('remember').checked?localStorage:sessionStorage).setItem('mari-session',r.token);$('pin').value='';open(r.token);}).withFailureHandler(fail).login($('id').value,$('pin').value,$('remember').checked,deviceId,deviceLabel);};
$('logout').onclick=()=>{google.script.run.logout(token);localStorage.removeItem('mari-session');sessionStorage.removeItem('mari-session');token='';frame.srcdoc='';fail({message:'로그아웃되었습니다.'});};
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||!token||e.data?.channel!=='mari-progress')return;$('sync').hidden=false;$('sync').textContent='학습 기록 저장 중';google.script.run.withSuccessHandler(()=>{$('sync').textContent='학습 기록 저장됨';frame.contentWindow.postMessage({channel:'mari-ack',eventId:e.data.event.eventId},'*');}).withFailureHandler(e=>{$('sync').textContent='기록 저장 실패';if(/로그인|기기|만료/.test(e.message||''))fail(e);}).recordProgress(token,e.data.event);});
setInterval(()=>{if(token)google.script.run.withFailureHandler(fail).heartbeat(token);},60000);try{const t=localStorage.getItem('mari-session')||sessionStorage.getItem('mari-session');if(t)open(t);}catch{}
</script></html>
