<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>최강 한문 암기장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: 한 줄짜리 공부 앱. 위에 단원 탭, 가운데 田字格(쓰기 칸)에 한자를 올려 묻고 답한다 */
:root{
  --paper:#F1F4F1; --surface:#FFFFFF; --ink:#1C2320; --muted:#5D6A63; --line:#D2DAD4;
  --grid:#D9A79F; --accent:#2B4C7E; --accent-ink:#FFFFFF; --accent-soft:#E2E9F3;
  --good:#2A7752; --good-soft:#E1F0E7; --bad:#B23A2E; --bad-soft:#F7E2DE; --seal:#B23A2E;
  --ghost:rgba(28,35,32,.13); --star:#D39200;
  --f-han:"Noto Serif KR","Noto Serif CJK KR","Batang","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121614; --surface:#1A201D; --ink:#E5EBE7; --muted:#97A39C; --line:#2E3833;
  --grid:#6E3F38; --accent:#93ADDE; --accent-ink:#0F1520; --accent-soft:#1E2A3C;
  --good:#6CC79C; --good-soft:#15281E; --bad:#EA7C6F; --bad-soft:#341B18; --seal:#C4483B;
  --ghost:rgba(229,235,231,.14); --star:#F0B63A; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#121614; --surface:#1A201D; --ink:#E5EBE7; --muted:#97A39C; --line:#2E3833;
  --grid:#6E3F38; --accent:#93ADDE; --accent-ink:#0F1520; --accent-soft:#1E2A3C;
  --good:#6CC79C; --good-soft:#15281E; --bad:#EA7C6F; --bad-soft:#341B18; --seal:#C4483B;
  --ghost:rgba(229,235,231,.14); --star:#F0B63A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;gap:14px;align-items:center}
.seal{flex:none;width:46px;height:46px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--f-han);font-weight:700;font-size:28px;border-radius:6px;transform:rotate(-3deg)}
header h1{margin:0;font-size:22px;line-height:1.25;font-weight:600;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:6px;overflow-x:auto;padding-block:12px 10px;margin-top:14px;border-bottom:1px solid var(--line);scrollbar-width:thin;scrollbar-color:var(--muted) var(--line)}
@supports selector(::-webkit-scrollbar){.tabs{scrollbar-width:auto;scrollbar-color:auto}}
.tabs::-webkit-scrollbar{height:5px}
.tabs::-webkit-scrollbar-track{background:var(--line);border-radius:3px}
.tabs::-webkit-scrollbar-thumb{background:var(--muted);border-radius:3px}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cnt{font-size:11.5px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;text-align:center;font-variant-numeric:tabular-nums}

.panel{padding-top:22px}
.panel h2{font-size:18px;margin:0 0 4px;font-weight:600}
.desc{color:var(--muted);margin:0 0 16px;font-size:15px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-size:15px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 13px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:13px;color:var(--muted)}
select{font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.mode:hover{border-color:var(--accent)}
.mode b{font-weight:600}
.mode span{font-size:13.5px;color:var(--muted)}

/* 田字格 */
.cells{display:inline-flex;flex-wrap:wrap}
.cell{--s:56px;isolation:isolate;position:relative;display:inline-grid;place-items:center;width:var(--s);height:var(--s);font-family:var(--f-han);font-weight:500;font-size:calc(var(--s) * .66);line-height:1;border:1.5px solid var(--grid);background:var(--surface);color:var(--ink)}
.cells .cell+.cell{margin-left:-1.5px}
.cell::before,.cell::after{content:"";position:absolute;z-index:-1}
.cell::before{left:50%;top:0;bottom:0;border-left:1px dashed var(--grid)}
.cell::after{top:50%;left:0;right:0;border-top:1px dashed var(--grid)}
.cell.xl{--s:128px}
.cell.lg{--s:76px}
.cell.blank{color:var(--accent)}

/* learn */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
.sec{margin-top:26px}
.sec h3{font-size:15px;font-weight:600;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
.sec h3 small{color:var(--muted);font-weight:400;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.card{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px}
.card.on{border-color:var(--star)}
.flip{width:100%;border:0;background:none;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border-radius:10px}
.card .cell{--s:52px}
.rd{font-size:13px;text-align:center;line-height:1.35;min-height:2.7em}
.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.icards .flip{padding:30px 10px 12px;gap:8px}
.icards .cell{--s:36px}
.icards .rd{font-size:13.5px;text-align:left;width:100%;min-height:5.4em}
.items{display:flex;flex-direction:column;gap:8px}
.item{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px}
.item.on{border-color:var(--star)}
.item .flip{flex-direction:row;align-items:flex-start;gap:14px;padding:12px 40px 12px 12px;text-align:left}
.item .cell{--s:44px}
.item .txt{min-width:0;flex:1;font-size:14.5px;line-height:1.55}
.item .txt b{font-weight:600;font-size:15.5px}
.star{position:absolute;top:4px;left:3px;z-index:1;width:20px;height:24px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center;font-size:16px;line-height:1;color:var(--line)}
.cards .flip{padding-inline:24px}
.item .star{left:auto;right:6px;top:8px}
.star:hover{color:var(--muted)}
.star[aria-pressed="true"]{color:var(--star)}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.k{color:var(--muted)}
.hide .card:not(.open) .rd,.hide .item:not(.open) .hid{visibility:hidden}
.tapnote{font-size:12px;color:var(--muted)}
.hide .card:not(.open) .tapnote{visibility:visible}
.card.open .tapnote,.panel:not(.hide) .tapnote{display:none}
@media (max-width:480px){.item .flip{flex-direction:column;gap:8px}}
.subhead{margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.modeMsg{color:var(--bad);font-size:14px;min-height:1.4em;margin:10px 0 0}
.fwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.fbig{border:0;background:none;padding:0;cursor:pointer}
.finfo{width:100%;padding:14px 16px;border-radius:12px;background:var(--accent-soft);font-size:15px;line-height:1.6}
.finfo b{font-weight:600}
.qstar{position:static;color:var(--line);font-size:22px;width:auto;padding:4px 8px}

/* quiz stage */
.stage-top{display:flex;gap:12px;align-items:center;padding-top:18px}
.prog{flex:1;display:flex;gap:10px;align-items:center;min-width:0}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
#progt,#scoret{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qcard{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 18px}
.ask{margin:0 0 16px;font-weight:600;font-size:16.5px}
.big{display:flex;justify-content:center;margin:6px 0 16px}
.say{font-size:24px;font-weight:600;text-align:center;line-height:1.45;text-wrap:balance;max-width:34ch}
.sub{text-align:center;color:var(--muted);margin:-4px 0 16px;font-size:14.5px}
.tform{display:flex;gap:8px}
.tform input{flex:1;min-width:0;font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}
.tform input:focus{border-color:var(--accent);outline:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font-size:15px;line-height:1.45;min-height:56px}
.opt.han{text-align:center}
.opt .oh{font-family:var(--f-han);font-size:34px;font-weight:500;line-height:1.2}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.tile{position:relative;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tile .cell{--s:54px}
.tile .num{height:24px;min-width:24px;border-radius:12px;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums;color:var(--muted);border:1px dashed var(--line)}
.tile.on .num{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tile.ok .num{background:var(--good);color:#fff;border-color:var(--good)}
.tile.no .num{background:var(--bad);color:#fff;border-color:var(--bad)}
.hint{margin-top:12px;font-size:14px;color:var(--muted)}
.hint summary{cursor:pointer}
.fb{margin-top:18px;padding:14px 16px;border-radius:12px;background:var(--good-soft);font-size:15px}
.fb.bad{background:var(--bad-soft)}
.fb .v{font-weight:600;color:var(--good)}
.fb.bad .v{color:var(--bad)}
.fb p{margin:6px 0 0}
.fb .row{margin-top:12px}
.end{text-align:center;padding:10px 0}
.score{font-size:46px;margin:4px 0;font-variant-numeric:tabular-nums}
.score b{font-weight:600}
.misslist{text-align:left;margin:16px 0;display:flex;flex-direction:column;gap:6px}
.misslist div{padding:8px 12px;border-radius:8px;background:var(--bad-soft);font-size:14.5px}
.end .row{justify-content:center}

/* writing */
.wbox{display:flex;flex-direction:column;align-items:center;gap:12px}
.wprompt{font-size:22px;font-weight:600;min-height:1.5em;text-align:center}
.pad{position:relative;width:min(100%,340px);aspect-ratio:1/1;max-width:100%;border:2px solid var(--grid);background:var(--surface);touch-action:none}
.pad .gv{position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed var(--grid)}
.pad .gh{position:absolute;top:50%;left:0;right:0;border-top:1px dashed var(--grid)}
.pad .gd1,.pad .gd2{position:absolute;inset:0;opacity:.35}
.pad .ghost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-han);font-weight:500;line-height:1;color:var(--ghost);pointer-events:none;user-select:none}
.pad .ghost.reveal{color:var(--bad);opacity:.4}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}

/* wrong note */
.wl{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.wl div{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-size:15px}
.wl .lab{font-family:var(--f-han);font-size:18px}
.wl .n{color:var(--bad);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:24px 0}
footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;max-width:65ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav aria-label="학습 메뉴" style="display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font:12px system-ui"><a href="https://www.marihome.co.kr/" target="_top" style="color:var(--accent)">MARI EDU LAB 홈</a><button type="button" onclick="sendToHostLogout()" style="font:inherit;padding:5px 10px;cursor:pointer">로그아웃</button></nav>

<div class="wrap">
  <header>
    <div class="seal" aria-hidden="true">漢</div>
    <div>
      <h1>최강 한문 암기장</h1>
      <p id="stat"></p>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="main"></main>
  <section id="stage" hidden>
    <div class="stage-top">
      <button class="btn" id="quit">그만하기</button>
      <div class="prog"><div class="bar"><i id="bari"></i></div><span id="progt"></span></div>
      <span id="scoret"></span>
    </div>
    <div class="qcard" id="qbox"></div>
  </section>
  <footer>교과서 사진 7장의 내용을 옮겨 만들었어요. 학생이 손으로 채운 칸(入學·難解·明月 등의 훈음, 성어 겉뜻)은 일반적으로 쓰는 훈음과 풀이로 정리했으니, 학교 수업 필기와 다른 곳이 있으면 수업 필기를 따르세요. 오답 기록은 이 기기의 브라우저에만 저장돼요.</footer>
</div>

<script>
function sendToHostLogout(){if(parent===window){location.href='https://www.marihome.co.kr/';return;}try{parent.postMessage({channel:'mari-logout'},parent.location.origin);}catch(error){console.warn(error);}}
(function(){
function sendToHost(message){if(parent===window)return;try{parent.postMessage(message,parent.location.origin);}catch(error){console.warn('학습 기록 전송을 건너뜁니다.',error);}}
function examEvent(type,extra={}){try{sendToHost({channel:'mari-exam',event:{type,eventId:crypto.randomUUID(),...extra}});}catch(error){console.warn('학습 기록 생성 실패',error);}}

const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 데이터 ---------- */
const SECTIONS={1:'更과 한자어',2:'한자어의 짜임',3:'벗에 관한 성어와 구절',4:'필수 한자성어 001~008',5:'어휘 풀이'};
const RAW={
1:[['更','다시 갱|고칠 경|시각 경'],['新','새로울 신|새 신'],['變','변할 변'],['三','석 삼|셋 삼'],['淸','맑을 청'],['白','흰 백'],['吏','벼슬아치 리|벼슬아치 이|관리 리'],['史','역사 사'],['官','벼슬 관']],
2:[['登','오를 등'],['山','산 산|메 산'],['入','들 입|들어갈 입'],['學','배울 학'],['歸','돌아갈 귀'],['家','집 가'],['難','어려울 난'],['解','풀 해'],['廣','넓을 광'],['告','알릴 고|고할 고'],['明','밝을 명'],['月','달 월'],['落','떨어질 낙|떨어질 락'],['葉','잎 엽'],['必','반드시 필'],['勝','이길 승'],['昇','오를 승'],['降','내릴 강'],['身','몸 신'],['體','몸 체'],['屋','집 옥'],['去','갈 거'],['來','올 래|올 내']],
3:[['伯','맏 백'],['牙','어금니 아'],['絶','끊을 절'],['絃','줄 현|악기줄 현'],['水','물 수'],['魚','물고기 어'],['之','어조사 지|갈 지'],['交','사귈 교'],['刎','목 벨 문|목벨 문'],['頸','목 경'],['竹','대나무 죽|대 죽'],['馬','말 마'],['故','옛 고|연고 고'],['友','벗 우'],['有','있을 유'],['朋','벗 붕'],['自','부터 자|~로부터 자|스스로 자'],['遠','멀 원'],['方','곳 방|모 방'],['不','아닐 불|아닐 부'],['亦','또 역|또한 역'],['樂','즐거울 락|즐길 락|즐거울 낙'],['乎','어조사 호'],['以','써 이'],['文','글월 문|글 문'],['會','모일 회'],['輔','도울 보'],['仁','어질 인']],
4:[['人','사람 인'],['成','이룰 성'],['虎','호랑이 호|범 호'],['種','씨 종'],['豆','콩 두'],['得','얻을 득'],['九','아홉 구'],['牛','소 우'],['一','하나 일|한 일'],['毛','털 모'],['近','가까울 근'],['墨','먹 묵'],['者','사람 자|놈 자'],['黑','검을 흑'],['燈','등불 등|등 등'],['火','불 화'],['可','가히 가|옳을 가'],['親','친할 친'],['羊','양 양'],['頭','머리 두'],['狗','개 구'],['肉','고기 육'],['易','바꿀 역|쉬울 이'],['地','처지 지|땅 지'],['思','생각 사'],['識','알 식'],['字','글자 자'],['憂','근심 우'],['患','근심 환']],
5:[['高','높을 고'],['架','시렁 가'],['價','값 가'],['知','알 지'],['過','허물 과|지날 과'],['改','고칠 개']]
};
const NOTES={
 '更':'更은 뜻에 따라 음이 달라요. 更新(갱신)은 다시 갱, 變更(변경)은 고칠 경, 三更(삼경)은 시각 경.',
 '易':'易地思之에서는 바꿀 역으로 읽어요.',

const norm=s=>String(s).replace(/[\s~.,·()?!'"]/g,'');
function checkReading(v,readings){
  const s=norm(v);if(!s)return{ok:false,msg:'답을 입력하세요.'};
  for(const r of readings){
    if(norm(r)===s)return{ok:true};
    const eum=norm(r).slice(-1),hun=norm(r).slice(0,-1),ih=s.slice(0,-1);
    if(s.length>=2&&s.slice(-1)===eum&&ih&&(hun.includes(ih)||ih.includes(hun)))return{ok:true};
  }
  if(s.length===1&&readings.some(r=>norm(r).slice(-1)===s))return{ok:false,msg:'음은 맞았어요. 훈(뜻)까지 함께 써야 해요.'};
  return{ok:false};
}
function hanjaOpts(h,exclude=[]){
  const o=[h];const add=a=>{for(const x of shuffle(a)){if(o.length>=4)return;if(!o.includes(x)&&!exclude.includes(x))o.push(x)}};
  const CONF=[['更','吏','史'],['架','價'],['絶','絃'],['昇','登'],['友','有'],['體','身'],['家','屋'],['思','患','憂'],['頭','頸'],['近','遠'],['自','白'],['人','入'],['九','力'],['牛','午']];
  add(CONF.filter(g=>g.includes(h)).flat().filter(x=>BY.c[x]));
  const sec=BY.c[h]?BY.c[h].sec:0;add(CHARS.filter(c=>c.sec===sec).map(c=>c.h));add(CHARS.map(c=>c.h));
  return shuffle(o);
}
function textOpts(correct,pool){const o=[correct];for(const x of shuffle(pool)){if(o.length>=4)break;if(!o.includes(x))o.push(x)}return shuffle(o)}
const pick=a=>a[Math.floor(Math.random()*a.length)];

function make(qt,it){
  const q={qt,pair:[qt,it],id:qt+':'+KEY(qt,it)};
  if(qt==='he'){Object.assign(q,{kind:'type',ask:'훈과 음을 쓰세요',big:cells(it.h,'xl'),ph:'예) 오를 등',check:v=>checkReading(v,it.readings),ansText:it.readings[0]+(it.h==='更'?' / 고칠 경 / 시각 경':''),label:it.h,explain:NOTES[it.h]||''});
    if(it.readings.length>1&&it.h!=='更')q.explain=(q.explain?q.explain+' ':'')+'함께 인정하는 답: '+it.readings.slice(1).join(', ');}
  else if(qt==='pk'||qt==='wp'){const r=it.h==='更'?pick(it.readings):it.readings[0];const opts=hanjaOpts(it.h);
    Object.assign(q,{id:'pk:'+it.h,kind:'choice',ask:'훈음에 맞는 한자를 고르세요',big:`<span class="say">${r}</span>`,opts:opts.map(h=>({html:h,h:true})),ci:opts.indexOf(it.h),ansText:`${it.h} (${r})`,label:it.h,explain:NOTES[it.h]||''});}
  else if(qt==='wr'){Object.assign(q,{kind:'type',ask:'한자어의 음(독음)을 쓰세요',big:cells(it.w,'lg'),ph:'예) 등산',check:v=>({ok:norm(v)===it.r}),ansText:it.r,label:it.w,explain:'뜻: '+it.m});}
  else if(qt==='wm'){const o=textOpts(it.m,W.filter(x=>x.m!==it.m).map(x=>x.m));Object.assign(q,{kind:'choice',one:true,ask:'이 한자어의 뜻으로 알맞은 것은?',big:cells(it.w,'lg'),opts:o.map(x=>({html:esc(x)})),ci:o.indexOf(it.m),ansText:`${it.r}: ${it.m}`,label:it.w,explain:`${it.w}(${it.r})`});}
  else if(qt==='wf'){const near=W.filter(x=>x.w!==it.w&&(x.r===it.r||[...x.w].some(c=>it.w.includes(c)))).map(x=>x.w);
    const o=[it.w];for(const x of [...shuffle(near),...shuffle(W.map(x=>x.w))]){if(o.length>=4)break;if(!o.includes(x))o.push(x)}const oo=shuffle(o);
    Object.assign(q,{kind:'choice',ask:'뜻에 맞는 한자어를 고르세요',big:`<span class="say">${esc(it.m)}</span>`,opts:oo.map(x=>({html:x,h:true})),ci:oo.indexOf(it.w),ansText:`${it.w}(${it.r})`,label:it.w,explain:it.r==='고가'?'高架(시렁 가)와 高價(값 가)는 음이 같아도 뜻이 달라요.':''});}
  else if(qt==='wt'){const T=['주술 관계','술목 관계','술보 관계','수식 관계','병렬 관계'];Object.assign(q,{kind:'choice',ask:'이 한자어의 짜임은?',big:cells(it.w,'lg'),opts:T.map(x=>({html:x})),ci:T.indexOf(it.t+' 관계'),ansText:it.t+' 관계',label:it.w,explain:`${it.w}(${it.r}): ${it.m}. ${TYPE_DEF[it.t]}`});}
  else if(qt==='ib'){const arr=[...it.w];const pos=Math.floor(Math.random()*arr.length);const ch=arr[pos];const disp=arr.map((c,i)=>i===pos?'□':c).join('');const o=hanjaOpts(ch,arr.filter(x=>x!==ch));
    Object.assign(q,{id:'ib:'+it.w,kind:'choice',ask:'빈칸에 들어갈 한자는?',big:cells(disp,'lg'),sub:esc(it.m),opts:o.map(h=>({html:h,h:true})),ci:o.indexOf(ch),ansText:`${it.w}(${it.r})`,label:it.w,explain:`${ch} = ${BY.c[ch]?BY.c[ch].readings[0]:''}. ${it.g?'겉뜻: '+it.g:''}`});}
  else if(qt==='im'){const o=textOpts(it.m,I.filter(x=>x.w!==it.w).map(x=>x.m));Object.assign(q,{kind:'choice',one:true,ask:'이 성어의 속뜻은?',big:cells(it.w,'lg'),opts:o.map(x=>({html:esc(x)})),ci:o.indexOf(it.m),ansText:`${it.r}: ${it.m}`,label:it.w,explain:it.g?'겉뜻: '+it.g:''});}
  else if(qt==='if'){const o=textOpts(it.w,I.filter(x=>x.w!==it.w).map(x=>x.w));Object.assign(q,{kind:'choice',ask:'속뜻에 맞는 성어를 고르세요',big:`<span class="say">${esc(it.m)}</span>`,opts:o.map(x=>({html:x,h:true})),ci:o.indexOf(it.w),ansText:`${it.w}(${it.r})`,label:it.w,explain:it.g?'겉뜻: '+it.g:''});}
  else if(qt==='ip'){const o=textOpts(it.w,I.filter(x=>x.p&&x.w!==it.w).map(x=>x.w));Object.assign(q,{kind:'choice',ask:'다음 인물 이야기에서 유래한 성어는?',big:`<span class="say">${esc(it.p)}</span>`,opts:o.map(x=>({html:x,h:true})),ci:o.indexOf(it.w),ansText:`${it.w}(${it.r})`,label:it.w,explain:it.y});}
  else if(qt==='ir'){Object.assign(q,{kind:'type',ask:'성어의 음(독음)을 쓰세요',big:cells(it.w,'lg'),ph:'예) 죽마고우',check:v=>({ok:norm(v)===it.r}),ansText:it.r,label:it.w,explain:(it.g?'겉뜻: '+it.g+' / ':'')+'속뜻: '+it.m});}
  else if(qt==='fl'){Object.assign(q,{kind:'flash',ask:'뜻을 떠올려 본 뒤 눌러서 확인하세요',big:cells(it.w,'lg'),star:'i:'+it.w,info:idiomInfo(it,true),ansText:`${it.r}: ${it.m}`,label:it.w});}
  else if(qt==='or'){Object.assign(q,{kind:'order',ask:'읽는(풀이하는) 순서대로 한자를 눌러 보세요',c:it.c,o:it.o,k:it.k,ansText:it.o.join(' '),label:it.c});}
  return q;
}

let count='10',range='0',irange='0';
function pool(k,full){
  if(k==='he'||k==='pk')return CHARS.filter(c=>full||range==='0'||(range==='star'?ST.has('c:'+c.h):c.sec===+range));
  if(k==='wt')return W.filter(x=>x.t);
  if(k[0]==='w')return W;
  let L=I;
  if(k==='ip')L=I.filter(x=>x.p);
  else if(k==='ib')L=I.filter(x=>x.w.length===4);
  else if(k[0]!=='i'&&k!=='fl')L=null;
  if(L)return(!full&&irange==='star')?L.filter(x=>ST.has('i:'+x.w)):L;
  if(k==='or')return ORD;
  return[];
}

    <div class="field"><label for="irangeSel">범위</label><select id="irangeSel"><option value="0">전체 성어 (${I.length}개)</option><option value="star">★ 별표한 성어만</option></select></div>${cntSeg}${modeBtns(t.imodes)}`;
  }else{

function wireCards(m,rerender){
  m.querySelectorAll('.flip').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));
  const hb=$('#hideBtn');if(hb)hb.onclick=()=>{hideMode=!hideMode;rerender()};
  const ss=$('#starSeg');if(ss)ss.onclick=e=>{const b=e.target.closest('button[data-s]');if(!b)return;onlyStar=b.dataset.s==='1';rerender()};
}
function startMode(k,title){
  if(k==='mix'){
    const types=['he','pk','wr','wm','wf','wt','ib','im','if','ip','ir','or'];const out=[],seen=new Set();let guard=0;
    while(out.length<20&&guard++<500){const qt=pick(types);const it=pick(pool(qt,true));const id=qt+':'+KEY(qt,it);if(seen.has(id))continue;seen.add(id);out.push([qt,it])}
    return startQuiz(out,title);
  }
  let items=shuffle(pool(k));
  if(!items.length){const mm=$('#modeMsg');if(mm)mm.textContent='별표한 항목이 없어요. 범위를 전체로 바꾸거나 ★를 먼저 표시하세요.';return}
  if(count!=='all')items=items.slice(0,+count);
  startQuiz(items.map(it=>[k,it]),title);
}

/* ---------- 퀴즈 진행 ---------- */
let Q=null;
function startQuiz(pairs,title){
  if(!pairs.length)return;
  Q={testId:crypto.randomUUID(),pairs,list:shuffle(pairs).map(([qt,it])=>make(qt,it)),i:0,score:0,miss:[],title};
  examEvent('test-start',{testId:Q.testId,title:Q.title,total:Q.list.length,score:0});
  $('#main').hidden=true;$('#stage').hidden=false;window.scrollTo(0,0);renderQ();
}
function exitQuiz(){if(Q&&Q.i<Q.list.length)examEvent('abort',{testId:Q.testId,title:Q.title,total:Q.list.length,score:Q.score});Q=null;$('#stage').hidden=true;$('#main').hidden=false}
$('#quit').onclick=()=>{exitQuiz();renderPanel()};
function renderQ(){
  const q=Q.list[Q.i];Q.done=false;
  $('#progt').textContent=`${Q.i+1} / ${Q.list.length}`;$('#bari').style.width=(Q.i/Q.list.length*100)+'%';$('#scoret').textContent=`맞힘 ${Q.score}`;
  let h=`<p class="ask">${q.ask}</p>`;
  if(q.big)h+=`<div class="big">${q.big}</div>`;
  if(q.sub)h+=`<p class="sub">${q.sub}</p>`;
  if(q.kind==='type')h+=`<form class="tform" id="tform"><input id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" lang="ko" placeholder="${q.ph}" aria-label="답 입력"><button class="btn primary" type="submit">확인</button></form>`;
  if(q.kind==='choice')h+=`<div class="opts ${q.one?'one':''}">${q.opts.map((o,i)=>`<button class="opt ${o.h?'han':''}" data-i="${i}">${o.h?`<span class="oh">${o.html}</span>`:o.html}</button>`).join('')}</div>`;
  if(q.kind==='order')h+=`<div class="tiles">${[...q.c].map((ch,i)=>`<button class="tile" data-i="${i}" aria-label="${ch}"><span class="cell">${ch}</span><span class="num"></span></button>`).join('')}</div><div class="row" style="justify-content:center"><button class="btn" id="ore">다시 고르기</button><button class="btn primary" id="ock" disabled>채점</button></div><details class="hint"><summary>풀이 힌트 보기</summary>${esc(q.k)}</details>`;
  if(q.kind==='flash'){h=`<p class="ask">${q.ask}</p><div class="fwrap"><button class="fbig" id="fbig" aria-label="뜻 보기">${q.big}</button><div class="row" style="justify-content:center">${starBtn(q.star,'qstar')}<button class="btn" id="frev">뜻 보기</button></div><div class="finfo" id="finfo" hidden>${q.info}</div><div class="row" id="fbtns" hidden style="justify-content:center"><button class="btn" id="fno">몰랐어요</button><button class="btn primary" id="fyes">알았어요</button></div></div>`;}
  h+=`<div class="fb" id="fb" hidden></div>`;
  const box=$('#qbox');box.innerHTML=h;
  if(q.kind==='flash'){
    const show=()=>{$('#finfo').hidden=false;$('#fbtns').hidden=false;$('#frev').hidden=true;$('#fyes').focus({preventScroll:true})};
    $('#fbig').onclick=show;$('#frev').onclick=show;
    const go=ok=>{if(Q.done)return;Q.done=true;if(ok){Q.score++;markRight(q)}else{Q.miss.push(q);markWrong(q)}examEvent('answer',{testId:Q.testId,title:Q.title,question:q.label,correct:ok,total:Q.list.length,score:Q.score});Q.i++;if(Q.i>=Q.list.length)endQuiz();else renderQ()};
    $('#fyes').onclick=()=>go(true);$('#fno').onclick=()=>go(false);
  }
  if(q.kind==='type'){const inp=$('#tin');setTimeout(()=>inp.focus(),30);
    $('#tform').onsubmit=e=>{e.preventDefault();if(Q.done)return;const r=q.check(inp.value);if(r.msg&&!r.ok&&!norm(inp.value)){inp.focus();return}
      inp.disabled=true;finish(r.ok,`정답: <b>${esc(q.ansText)}</b>${r.ok?'':` · 내 답: ${esc(inp.value||'(빈칸)')}`}`+(r.msg?`<p>${r.msg}</p>`:''),true);};}
  if(q.kind==='choice')box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(Q.done)return;const i=+b.dataset.i;const ok=i===q.ci;
    box.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===q.ci)x.classList.add('right');else if(j===i)x.classList.add('wrong')});
    finish(ok,`정답: <b>${q.ansText}</b>`);});
  if(q.kind==='order'){let seq=[];const tiles=[...box.querySelectorAll('.tile')];const n=tiles.length;
    const upd=()=>{tiles.forEach((t,i)=>{const p=seq.indexOf(i);t.classList.toggle('on',p>=0);t.querySelector('.num').textContent=p>=0?p+1:''});$('#ock').disabled=seq.length<n};
    tiles.forEach((t,i)=>t.onclick=()=>{if(Q.done)return;const p=seq.indexOf(i);if(p>=0)seq=seq.slice(0,p);else seq.push(i);upd()});
    $('#ore').onclick=()=>{if(Q.done)return;seq=[];upd()};
    $('#ock').onclick=()=>{if(Q.done)return;let ok=true;tiles.forEach((t,i)=>{const mine=seq.indexOf(i)+1;const good=mine===q.o[i];if(!good)ok=false;t.classList.remove('on');t.classList.add(good?'ok':'no');t.querySelector('.num').textContent=q.o[i]});
      const readOrder=[...q.c].map((ch,i)=>[q.o[i],ch]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(' → ');
      $('#ore').disabled=true;$('#ock').disabled=true;
      finish(ok,`풀이 순서: <b>${readOrder}</b><p>${esc(q.k)}</p>`);};
  }
}
function finish(ok,detail,canOverride){
  const q=Q.list[Q.i];Q.done=true;
  if(ok){Q.score++;markRight(q)}else{Q.miss.push(q);markWrong(q)}examEvent('answer',{testId:Q.testId,title:Q.title,question:q.label,correct:ok,total:Q.list.length,score:Q.score});
  const fb=$('#fb');fb.hidden=false;fb.className='fb'+(ok?'':' bad');
  const last=Q.i===Q.list.length-1;
  fb.innerHTML=`<span class="v" id="verd">${ok?'맞았어요':'틀렸어요'}</span><p>${detail}</p>${q.explain?`<p class="k">${esc(q.explain)}</p>`:''}<div class="row">${(!ok&&canOverride)?'<button class="btn" id="ovr">내 답도 맞아요</button>':''}<button class="btn primary" id="nxt">${last?'결과 보기':'다음 문제'}</button></div>`;
  $('#scoret').textContent=`맞힘 ${Q.score}`;
  const ov=$('#ovr');if(ov)ov.onclick=()=>{Q.score++;examEvent('override',{testId:Q.testId,title:Q.title,question:q.label,correct:true,total:Q.list.length,score:Q.score});Q.miss=Q.miss.filter(x=>x!==q);markRight(q);fb.className='fb';$('#verd').textContent='맞은 걸로 처리했어요';ov.remove();$('#scoret').textContent=`맞힘 ${Q.score}`};
  const nx=$('#nxt');nx.onclick=()=>{Q.i++;if(Q.i>=Q.list.length)endQuiz();else{renderQ();}};nx.focus({preventScroll:true});
  fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function endQuiz(){
  const n=Q.list.length,s=Q.score;$('#scoret').textContent=`맞힘 ${s}`;examEvent('finish',{testId:Q.testId,title:Q.title,total:n,score:s});$('#bari').style.width='100%';$('#progt').textContent=`${n} / ${n}`;
  const rate=s/n;const msg=rate===1?'모두 맞혔어요.':rate>=.8?'거의 다 왔어요. 틀린 것만 한 번 더 풀어 보세요.':rate>=.5?'틀린 문제를 외우기 탭에서 다시 확인하고 풀어 보세요.':'외우기 탭에서 먼저 훑어본 뒤 다시 도전해 보세요.';
  $('#qbox').innerHTML=`<div class="end"><p class="eyebrow">${esc(Q.title)}</p><p class="score"><b>${s}</b> / ${n}</p><p>${msg}</p>${Q.miss.length?`<div class="misslist">${Q.miss.map(q=>`<div><b style="font-family:var(--f-han)">${q.label}</b> · ${esc(q.ansText)}</div>`).join('')}</div>`:''}<div class="row">${Q.miss.length?'<button class="btn primary" id="rmiss">틀린 것만 다시</button>':''}<button class="btn" id="rall">처음부터 다시</button><button class="btn" id="rback">돌아가기</button></div></div>`;
  const pairs=Q.pairs,miss=Q.miss.map(q=>q.pair),title=Q.title;
  const rm=$('#rmiss');if(rm)rm.onclick=()=>startQuiz(miss,title+' · 틀린 문제');
  $('#rall').onclick=()=>startQuiz(pairs,title);
  $('#rback').onclick=()=>{exitQuiz();renderPanel()};
}

 const run=setRun;run.grades=run.data.questions.map((q,i)=>q.kind==='choice'?+run.answers[i]===q.correct:(/^[\u3400-\u9fff]+$/.test(q.answer)||q.answer==='도울 보'?norm(run.answers[i])===norm(q.answer):null));
 $('#main').innerHTML=`<section class="panel"><h2>${esc(run.title)} · 채점</h2><p class="desc">객관식과 정해진 단답은 자동 채점합니다. 서술형은 정답 예시와 비교해 판정하세요. 종이에 쓴 한자는 획도 확인하세요.</p>${run.data.questions.map((q,i)=>`<article style="padding:16px 0;border-bottom:1px solid #ddd"><h3>${q.n}. ${esc(q.ask)}</h3><p>내 답: ${esc(q.kind==='choice'?q.opts[+run.answers[i]]:run.answers[i])}</p><p>정답${q.kind==='text'?' 예시':''}: <b>${esc(q.kind==='choice'?q.opts[q.correct]:q.answer)}</b></p><p>${esc(q.explain)}</p>${q.kind==='choice'?`<p>${run.grades[i]?'정답':'오답'}</p>`:`<label>${q.n}번 판정 <select aria-label="${q.n}번 판정" data-grade="${i}"><option value="">판정 선택</option><option value="true" ${run.grades[i]===true?'selected':''}>맞았어요</option><option value="false" ${run.grades[i]===false?'selected':''}>틀렸어요</option></select></label>`}</article>`).join('')}<p id="gradeWarning" role="status"></p><button class="btn primary" id="pdfFinish">채점 완료 · 결과 보기</button></section>`;
 $('#pdfFinish').onclick=()=>{document.querySelectorAll('[data-grade]').forEach(el=>run.grades[+el.dataset.grade]=el.value===''?null:el.value==='true');if(run.grades.includes(null)){$('#gradeWarning').textContent='단답형 판정을 모두 선택하세요.';return}run.finished=true;const score=run.grades.filter(Boolean).length;run.data.questions.forEach((q,i)=>examEvent('answer',{testId:run.id,title:run.title,question:`${q.n}. ${q.ask}`,correct:run.grades[i],total:20,score:run.grades.slice(0,i+1).filter(Boolean).length}));examEvent('finish',{testId:run.id,title:run.title,total:20,score});$('#main').innerHTML=`<section class="panel"><h2>${esc(run.title)} · 결과</h2><p class="score"><b>${score*5}점</b> / 100점</p><p>20문항 중 ${score}문항 정답 · ${Math.floor((Date.now()-run.started)/60000)}분 소요</p><p>서술형은 본인 판정이 포함된 점수입니다.</p><h3>다시 볼 문항</h3>${run.data.questions.filter((q,i)=>!run.grades[i]).map(q=>`<p>${q.n}. ${esc(q.ask)}<br>정답: ${esc(q.kind==='choice'?q.opts[q.correct]:q.answer)}<br>${esc(q.explain)}</p>`).join('')||'<p>모두 맞혔어요.</p>'}<button class="btn" id="pdfBack">모의시험 목록</button></section>`;$('#pdfBack').onclick=()=>{stopSet();renderPanel()};window.scrollTo(0,0);};window.scrollTo(0,0);
}

renderTabs();renderPanel();
})();
</script>
