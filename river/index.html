<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#19799f"><title>CHOI RIVER · 나의 일정</title><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./style.css?v=10"><style>.completed-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #e4edf0}.completed-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.35}.completed-subject{font-size:11px;color:#60818d}.completed-title{font-size:13px;overflow-wrap:anywhere}.completed-row .btn{flex:none;padding:4px 7px;font-size:11px;border-radius:7px}#status-dialog .actions{display:flex;flex-wrap:wrap;gap:5px}#status-dialog .btn{padding:7px 9px}.academy-inline{margin:4px 0 7px;padding:9px 10px}.academy-inline-heading{display:flex;align-items:center;justify-content:space-between;gap:6px}.academy-inline-heading h2{margin:0;font-size:15px}.academy-inline .btn{font-size:11px;padding:5px 7px;border-radius:7px}.academy-inline-row{display:flex;align-items:center;gap:6px;padding:7px 0;border-top:1px solid #e4edf0}.academy-inline-body{display:flex;flex-direction:column;flex:1;min-width:0;gap:1px;line-height:1.3;font-size:12px}.academy-inline-body strong{font-size:13px}.academy-inline-body small{color:#a25365}.academy-inline-buttons{display:flex;gap:3px}.notification-link{display:block;text-align:right;font-size:11px;margin:2px 0 5px}#academy-dialog h2{font-size:18px;line-height:1.35}#academy-dialog .actions{gap:5px}#academy-dialog .btn{padding:7px 9px}.detail-actions{flex-wrap:wrap;gap:6px}.detail-status-buttons{display:flex;gap:4px;flex:1;justify-content:flex-end}.detail-status-buttons button{padding:7px 9px!important;font-size:12px!important;white-space:nowrap;border-radius:8px!important}.detail-status-buttons button[aria-pressed="true"]{outline:2px solid #19799f;outline-offset:1px}</style></head><body>
<header><div class="top"><a href="./" class="brand"><span class="brand-eyes" aria-hidden="true"><i></i><i></i></span>CHOI <span>RIVER</span></a><a class="btn" href="https://app.notion.com/p/2a9215b9b77480a7bc8df48543490cf4" target="_blank" rel="noopener noreferrer">노션 ↗</a><button class="btn primary" id="connect">불러오기</button></div></header>
<main><section class="schedule-workspace" aria-label="일정 목록"><div class="workspace-actions"><span id="message" role="status" aria-live="polite"></span><button class="btn" id="logout" hidden>로그아웃</button><a class="btn primary" href="./write.html">＋ 일정 쓰기</a></div><section class="panel academy-inline"><div class="academy-inline-heading"><h2>학원 일정</h2><button class="btn" id="academy-add">＋ 수업</button></div><div id="academy-rows"></div></section><a class="notification-link" href="./notifications.html">알림 설정 ↗</a><nav class="chips" id="chips" aria-label="과목 선택"></nav>
<div class="layout"><div id="left"></div><div id="right"></div></div>
</section><footer><span>CHOI RIVER · 오늘의 작은 한 걸음</span><span id="sync">일정은 한국 시간 · 월요일~일요일 기준입니다.</span></footer></main>
<dialog id="login"><form id="login-form"><h2>나의 일정 열기</h2><p>일정 접근 암호를 입력해 주세요.</p><label for="password">접근 암호</label><input id="password" type="password" autocomplete="current-password" required><label class="remember-option"><input type="checkbox" id="remember"> 이 기기에서 로그인 유지</label><div class="actions"><button class="btn" type="button" id="cancel">취소</button><button class="btn primary" type="submit">열기</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><dialog id="detail" aria-labelledby="detail-title">
<div class="detail-shell"><div class="detail-eyes" aria-hidden="true"><i></i><i></i></div>
<div class="detail-top"><span class="detail-subject" id="detail-subject"></span><button class="detail-close" id="detail-close" aria-label="상세 카드 닫기" type="button">×</button></div>
<div class="detail-body"><h2 id="detail-title"></h2><p id="detail-task" hidden></p><dl><dt>기한</dt><dd id="detail-due"></dd><dt>상태</dt><dd id="detail-status"></dd><dt>제출처</dt><dd id="detail-submission"></dd></dl><p class="detail-reminder" id="detail-reminder"></p></div>
<div class="detail-actions"><a id="detail-notion" target="_blank" rel="noopener noreferrer">노션 원문 ↗</a><div class="detail-status-buttons" role="group" aria-label="상태 선택"><button id="detail-start" type="button">시작 전</button><button id="detail-progress" type="button">진행 중</button><button id="detail-done" type="button">완료</button></div></div><p id="detail-error" role="alert" hidden></p></div></dialog>
<dialog id="status-dialog" aria-labelledby="status-title"><h2 id="status-title"></h2><p id="status-description"></p><p id="status-error" role="alert" hidden></p><div class="actions"><button class="btn" id="status-cancel" type="button">취소</button><button class="btn" id="status-start" type="button">시작 전</button><button class="btn" id="status-progress" type="button">진행 중</button><button class="btn primary" id="status-done" type="button">완료</button></div></dialog>
<dialog id="academy-dialog" aria-labelledby="academy-dialog-title"><form id="academy-form"><h2 id="academy-dialog-title"></h2><p id="academy-current"></p><label class="write-field" id="academy-kind-field"><span>학원</span><select id="academy-kind"><option>바디PT</option><option>과학</option></select></label><label class="remember-option" id="academy-next-field"><input id="academy-next" type="checkbox" checked>다음 수업도 등록</label><label class="write-field" id="academy-date-field"><span id="academy-date-label"></span><input id="academy-date" type="datetime-local"></label><label class="remember-option" id="academy-charge-field"><input id="academy-charge" type="checkbox">결석해도 횟수 1회 차감</label><p id="academy-error" role="alert"></p><div class="actions"><button class="btn" type="button" id="academy-cancel">취소</button><button class="btn primary" id="academy-save">확인</button></div></form></dialog><script src="./config.js"></script><script type="module" src="./app.mjs?v=7"></script></body></html>
