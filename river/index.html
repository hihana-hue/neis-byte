<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#19799f"><title>CHOI RIVER · 나의 일정</title><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./style.css?v=3"></head><body>
<header><div class="top"><a href="./" class="brand"><span class="brand-eyes" aria-hidden="true"><i></i><i></i></span>CHOI <span>RIVER</span></a><a class="btn" href="https://app.notion.com/p/2a9215b9b77480a7bc8df48543490cf4" target="_blank" rel="noopener noreferrer">노션 DB 바로가기 ↗</a><button class="btn primary" id="connect">일정 불러오기</button></div></header>
<main><section class="intro"><div><div class="eyebrow">MY LITTLE STEPS</div><h1>강아, 오늘도<br> 하나씩 해보자.</h1><p>오늘 할 일도, 다가오는 일정도 놓치지 않게.</p></div><div class="date" id="date"></div></section>
<div class="summary"><div class="stat"><label>이번 주 할 일</label><strong id="n-week">—</strong></div><div class="stat"><label>다음 주 할 일</label><strong id="n-next">—</strong></div><div class="stat"><label>진행 중</label><strong id="n-active">—</strong></div><div class="stat"><label>시작 예정</label><strong id="n-planned">—</strong></div></div>
<aside class="notice" id="notice"><p id="message" role="status" aria-live="polite">노션 연결을 준비하고 있어요. 연결 전에는 실제 일정이 표시되지 않습니다.</p><button class="btn" id="preview">샘플 화면 보기</button></aside>
<div class="toolbar"><input id="search" type="search" placeholder="주제 또는 과목 검색" aria-label="주제 또는 과목 검색"><button class="btn" id="refresh">새로고침 ↻</button><button class="btn" id="logout" hidden>잠그기</button></div><nav class="chips" id="chips" aria-label="과목 선택"></nav>
<div class="layout"><div id="left"></div><div id="right"></div></div>
<footer><span>CHOI RIVER · 오늘의 작은 한 걸음</span><span id="sync">일정은 한국 시간 · 월요일~일요일 기준입니다.</span></footer></main>
<dialog id="login"><form id="login-form"><h2>나의 일정 열기</h2><p>일정 접근 암호를 입력해 주세요.</p><label for="password">접근 암호</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button class="btn" type="button" id="cancel">취소</button><button class="btn primary" type="submit">열기</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><dialog id="detail" aria-labelledby="detail-title">
<div class="detail-shell"><div class="detail-eyes" aria-hidden="true"><i></i><i></i></div>
<div class="detail-top"><span class="detail-subject" id="detail-subject"></span><button class="detail-close" id="detail-close" aria-label="상세 카드 닫기" type="button">×</button></div>
<div class="detail-body"><h2 id="detail-title"></h2><p id="detail-task" hidden></p><dl><dt>기한</dt><dd id="detail-due"></dd><dt>상태</dt><dd id="detail-status"></dd><dt>제출처</dt><dd id="detail-submission"></dd></dl><p class="detail-reminder" id="detail-reminder"></p></div>
<div class="detail-actions"><a id="detail-notion" target="_blank" rel="noopener noreferrer">노션 원문 ↗</a><button id="detail-complete" type="button">제출했어 ✓</button></div><p id="detail-error" role="alert" hidden></p></div></dialog>
<script src="./config.js"></script><script type="module" src="./app.mjs?v=2"></script></body></html>
