<header><div class="top"><a href="./" class="brand">CHOI <span>RIVER</span></a><div class="header-actions"><a class="btn" id="student-notion" style="display:none" hidden target="_blank" rel="noopener noreferrer" title="노션 데이터베이스 열기">노션 ↗</a><a class="btn" href="./write.html" title="학교 일정 등록" aria-label="학교 일정 등록">학교 ＋</a><button class="btn" id="academy-add" type="button" title="학원 일정 등록" aria-label="학원 일정 등록">학원 ＋</button><button class="btn icon-btn" id="notifications-open" aria-label="설정" title="설정"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16M8 3v6M16 9v6M10 15v6"/></svg></button><button class="btn" id="connect" aria-label="연결하기" title="연결하기">연결하기</button><button class="btn icon-btn" id="logout" hidden aria-label="로그아웃" title="로그아웃"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H4v16h5M14 8l4 4-4 4M8 12h12"/></svg></button></div></div></header>
<main><section class="schedule-workspace" aria-label="일정 목록"><div class="workspace-actions"><span id="message" role="status" aria-live="polite"></span><time id="local-clock" aria-label="한국 현재 날짜와 시간"></time></div><section class="academy-strip" aria-label="학원 일정"><div id="academy-rows"></div></section><nav class="chips" id="chips" aria-label="과목 선택"></nav>
<div class="layout"><div id="left"></div><div id="right"></div></div>
</section><footer><span>CHOI RIVER · 오늘의 작은 한 걸음</span><span id="sync">일정은 한국 시간 · 월요일~일요일 기준입니다.</span></footer></main>
<dialog id="login"><form id="login-form"><h2>학생 일정 연결</h2><p>안내받은 학생 연결코드를 입력해 주세요.</p><label for="password">연결코드</label><div class="code-input"><input id="password" autocapitalize="none" spellcheck="false" type="password" autocomplete="current-password" required><button class="code-visibility" type="button" data-code-visibility="password" aria-controls="password" aria-label="연결코드 보기" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><label class="remember-option"><input type="checkbox" id="remember"> 이 기기에서 로그인 유지</label><div class="actions"><button class="btn" type="button" id="cancel">취소</button><button class="btn primary" type="submit">연결하기</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><dialog id="detail" aria-labelledby="detail-title">
<div class="detail-shell"><div class="detail-eyes" aria-hidden="true"><i></i><i></i></div>
<div class="detail-top"><span class="detail-subject" id="detail-subject"></span><button class="detail-close" id="detail-close" aria-label="상세 카드 닫기" type="button">×</button></div>
<div class="detail-body"><h2 id="detail-title"></h2><p id="detail-task" hidden></p><dl><dt>기한</dt><dd class="detail-due-row"><span id="detail-due"></span><a id="detail-notion" target="_blank" rel="noopener noreferrer">노션 원문 ↗</a></dd><dt>상태</dt><dd id="detail-status"></dd><dt>제출처</dt><dd id="detail-submission"></dd></dl><p class="detail-reminder" id="detail-reminder"></p></div>
<div class="detail-actions"><div class="detail-status-buttons" role="group" aria-label="상태 선택"><button id="detail-start" type="button">시작 전</button><button id="detail-progress" type="button">진행 중</button><button id="detail-done" type="button">완료</button></div></div><p id="detail-error" role="alert" hidden></p></div></dialog>

<dialog id="academy-dialog" aria-labelledby="academy-dialog-title"><form id="academy-form"><div class="academy-dialog-heading"><h2 id="academy-dialog-title"></h2><button class="academy-close" type="button" id="academy-cancel" aria-label="학원 팝업 닫기" title="닫기"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><p id="academy-current"></p><div id="academy-status-actions" class="actions"><button class="btn primary" type="button" id="academy-attend">완료 · 출석</button><button class="btn" type="button" id="academy-change">보강</button><button class="btn" type="button" id="academy-absent">결석</button></div><label class="write-field" id="academy-kind-field"><span>학원</span><select id="academy-kind"><option value="바디PT">바디PT</option><option>과학</option></select></label><label class="write-field" id="academy-type-field"><span>수업 구분</span><select id="academy-type"></select></label><label class="write-field" id="academy-date-field"><span id="academy-date-label"></span><div class="date-weekday-field"><input id="academy-date" type="datetime-local" aria-describedby="academy-weekday"><output id="academy-weekday" for="academy-date" aria-live="polite"></output></div></label><label class="remember-option" id="academy-charge-field"><input id="academy-charge" type="checkbox">결석해도 횟수 1회 차감</label><p id="academy-error" role="alert"></p><div class="actions"><button class="btn primary" id="academy-save">확인</button></div></form></dialog><dialog id="notify-dialog" aria-labelledby="notify-title"><div class="notify-heading"><h2 id="notify-title">설정</h2><button class="btn" id="notify-close" type="button" aria-label="설정 닫기">×</button></div>
<section class="notify-section"><h2>학생 연결</h2><p>웹과 위젯에서 같은 학생 연결코드를 사용합니다.</p><p>학생을 바꾸려면 로그아웃 후 연결하기를 눌러 다른 학생 코드를 입력해 주세요.</p><p>위젯 앱에서도 코드 생성 없이 학생 연결코드를 입력하면 됩니다.</p></section><p id="notify-result" role="status" aria-live="polite"></p></dialog><script src="./config.js"></script><script type="module" src="./app.mjs?v=43"></script><script type="module" src="./clock.mjs?v=1"></script><script type="module" src="./code-visibility.mjs?v=1"></script></body></html>
