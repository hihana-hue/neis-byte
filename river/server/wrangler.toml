name = "choi-river-notion"
main = "worker.mjs"
compatibility_date = "2026-10-17"

[vars]
ALLOWED_ORIGIN = "https://www.marihome.co.kr"
SCHOOL_DATA_SOURCE_ID = "2a9215b9-b774-8167-be3a-000bcc48a1f5"

# Set NOTION_TOKEN and RIVER_ACCESS_KEY as encrypted Worker secrets.


ACADEMY_DATA_SOURCE_ID = "3fd215b9-b774-806e-9ed3-000b1b1df0f9"

[triggers]
crons = []

# Add a KV binding named RIVER_KV to choi-river-notifications in Cloudflare Dashboard.

# Keep the existing RIVER_KV binding; copy its real namespace ID from your dashboard.
[[durable_objects.bindings]]
name = "STUDENT_WIDGETS"
class_name = "StudentWidgetDevices"

[[migrations]]
tag = "student-widgets-v1"
new_sqlite_classes = ["StudentWidgetDevices"]

