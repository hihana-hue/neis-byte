<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>학원 · CHOI RIVER</title><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./style.css?v=9"></head>
<body><header><div class="top"><a class="brand" href="./">CHOI <span>RIVER</span></a><a class="btn" href="./">학교</a><button id="connect" class="btn primary">연결</button></div></header>
<main class="academy-page"><div class="academy-toolbar"><h1>학원 수업</h1><a class="btn" target="_blank" rel="noopener noreferrer" href="https://app.notion.com/p/3fd215b9b7748060b5e6fac7f06e6cbf">노션 ↗</a><button class="btn primary" id="add">＋ 수업 등록</button></div>
<p id="message" role="status" aria-live="polite"></p><div id="counts" class="academy-counts"></div><p class="academy-caption">노션 기록 기준 · 출석은 1회, 결석은 회차 차감 선택 시만 계산</p>
<p class="academy-caption">휴대폰 푸시 알림은 아직 연결 전이에요.</p>
<nav class="chips" id="filters" aria-label="학원 선택"></nav><section id="lessons" aria-live="polite"></section></main>
<dialog id="login"><form id="login-form"><h2>학원 일정 열기</h2><label for="password">사이트 접근 암호</label><input id="password" type="password" autocomplete="current-password" required><label class="remember-option"><input id="remember" type="checkbox">이 기기에서 로그인 유지</label><div class="actions"><button class="btn" type="button" id="cancel-login">취소</button><button class="btn primary">열기</button></div></form></dialog>
<dialog id="editor"><form id="lesson-form"><h2 id="editor-title">수업 등록</h2><label class="write-field" id="kind-field"><span>학원</span><select id="kind" required><option>운동</option><option>과학</option></select></label><label class="write-field"><span>수업 날짜 · 시작 시간</span><input id="start" type="datetime-local" required></label><label class="write-field" id="note-field"><span>메모 (선택)</span><input id="note" type="text" maxlength="1000"></label><p id="edit-warning" class="academy-caption" hidden>날짜를 바꾸면 출결이 ‘예정’으로 돌아가고 변경 이력이 남아요.</p><p id="editor-error" role="alert"></p><div class="actions"><button class="btn" type="button" id="cancel-edit">취소</button><button id="save" class="btn primary">노션에 저장</button></div></form></dialog>
<dialog id="attendance"><form id="attendance-form"><h2 id="attendance-title">출결 기록</h2><p id="attendance-name"></p><label id="charge-field" class="remember-option"><input id="charge" type="checkbox">결석해도 수강 횟수 1회 차감</label><p id="attendance-error" role="alert"></p><div class="actions"><button class="btn" type="button" id="cancel-attendance">취소</button><button class="btn primary" id="save-attendance">저장</button></div></form></dialog>
<script src="./config.js"></script><script type="module" src="./academy.mjs?v=1"></script></body></html>
